<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Návrh: Pred cestou na chatu</title>
<!-- Design prototype only. Standalone, not served by the app. Content is sample text. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFE5D3;--surface:#FBF6EC;--surface2:#F4EBDB;--ink:#2B1D14;--muted:#6B5644;--line:#DCC9AE;--forest:#4A2C1A;--moss:#5E6B24;--amber:#96540F;--amber-soft:#F6DFB8;--warn:#A3361E;--warn-soft:#F6D6C8;--ok:#3F6E2C}
[data-theme=dark]{--bg:#1A1410;--surface:#241C16;--surface2:#2D231B;--ink:#F1E7D9;--muted:#B9A38C;--line:#47382B;--forest:#F2DBB8;--moss:#B9C46F;--amber:#EDA94E;--amber-soft:#3F2C16;--warn:#F08C70;--warn-soft:#43241A;--ok:#93C67E}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#2a211b;font-family:"Alegreya Sans",system-ui,sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0 30px}
button{font:inherit;color:inherit}

/* design toolbar, not part of the app */
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font:13px ui-monospace,Menlo,monospace}
.tools button{background:#3a2e25;color:#e9dccb;border:1px solid #5c4a3c;border-radius:6px;padding:7px 10px;cursor:pointer}
.tools button[aria-pressed=true]{background:#e9dccb;color:#2a211b}

.phone{width:380px;height:780px;border-radius:28px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 0 0 8px #120d0a,0 20px 50px rgba(0,0,0,.5)}
@media (max-width:420px){.phone{width:100vw;height:calc(100dvh - 60px);border-radius:0;box-shadow:none}}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

/* ---------- presentation ---------- */
.deck{background:#1E1712;color:#2B1D14;user-select:none;-webkit-user-select:none}
.slide{position:absolute;inset:0 0 68px 0;display:flex;flex-direction:column;visibility:hidden;background:#1E1712}
.slide.on,.slide.prev{visibility:visible}
.slide.on{z-index:2;animation:wipe .42s steps(7,end) both}
.slide.on.back{animation-name:wipeback}
@keyframes wipe{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
@keyframes wipeback{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.scene{display:block;width:100%;flex:1 1 auto;min-height:150px;overflow:visible}
.dlg{flex:0 1 auto;max-height:72%;margin:-6px 8px 8px;background:#FBF6EC;border:4px solid #5C4033;box-shadow:inset 0 0 0 3px #E8D2A6,0 0 0 2px #2B1D14;padding:14px 16px 16px;overflow:auto;position:relative}
.dlg h2{font:700 25px/1.1 Alegreya,serif;margin:0 0 6px;color:#4A2C1A}
.dlg .kick{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:#96540F;margin:0 0 4px}
.dlg p{margin:0 0 10px;font-size:16px;line-height:1.35}
.dlg .muted{color:#6B5644;font-size:14px}
.b{will-change:transform}
.slide.on .b{animation:pop .32s steps(4,end) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}

.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:5;pointer-events:none}
.bars i{flex:1;height:4px;background:rgba(255,255,255,.3)}
.bars i.done{background:#FFD54A}
.skip{position:absolute;top:22px;right:10px;z-index:6;background:#2B1D14cc;color:#FBF6EC;border:2px solid #FBF6EC;padding:0 12px;height:44px;font:700 13px ui-monospace,Menlo,monospace;cursor:pointer}
.nav{position:absolute;left:0;right:0;bottom:0;height:68px;background:#5C4033;border-top:4px solid #2B1D14;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:4}
.nav button{height:48px;border:3px solid #2B1D14;background:#E8D2A6;font:700 16px ui-monospace,Menlo,monospace;cursor:pointer;box-shadow:inset -3px -3px 0 #C9A67A}
.nav button:active{box-shadow:inset 3px 3px 0 #C9A67A}
.nav .prevb{width:56px}
.nav .nextb{flex:1;background:#FFD54A;box-shadow:inset -3px -3px 0 #C08A1E}
.nav .count{color:#E8D2A6;font:12px ui-monospace,Menlo,monospace;min-width:34px;text-align:center}
.nav button:disabled{opacity:.35}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.slot{background:#E8D2A6;border:2px solid #8A6A4A;box-shadow:inset 2px 2px 0 #C9A67A;padding:6px 2px 4px;text-align:center;font:12.5px/1.1 "Alegreya Sans",sans-serif;color:#2B1D14;min-height:74px;width:100%;position:relative;cursor:pointer}
.slot.got{background:#DCE6C2;border-color:#3F6E2C;box-shadow:inset 2px 2px 0 #B9C99A}
.slot.got svg{opacity:.5}
.slot.got::after{content:"✓";position:absolute;top:2px;right:2px;width:18px;height:18px;background:#3F6E2C;color:#FBF6EC;font:900 13px/18px system-ui,sans-serif;text-align:center;animation:pop .2s steps(2) both}
.packbar{display:flex;align-items:center;gap:8px;font:12px ui-monospace,Menlo,monospace;color:#6B5644;margin:0 0 6px}
.packbar i{flex:1;height:8px;background:#E8D2A6;border:2px solid #8A6A4A}
.packbar i b{display:block;height:100%;background:#3F6E2C}
.slot svg{width:36px;height:36px;display:block;margin:0 auto 4px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;background:#F4EBDB;border:2px solid #DCC9AE;padding:8px}
.row svg{width:36px;height:36px;flex:none}
.row b{display:block;font-size:16px}
.row span{font-size:14px;color:#6B5644}
.tip{background:#F6DFB8;border-left:6px solid #96540F;padding:8px 10px;font-size:14.5px;margin-top:10px}
.chip{display:inline-block;background:#4A2C1A;color:#FBF6EC;font:700 11px ui-monospace,Menlo,monospace;padding:3px 6px;margin-right:4px}
.warnbox{background:#A3361E;color:#FBF6EC;padding:10px 12px;border:3px solid #2B1D14;margin-bottom:10px}
.warnbox b{font:700 19px/1.15 Alegreya,serif;display:block}
.warnbox span{font-size:14px}
.calc{background:#F4EBDB;border:2px solid #DCC9AE;padding:10px}
.calc .who{font-size:13px;color:#6B5644;margin-bottom:6px}
.steps{display:flex;gap:10px}
.step{flex:1}
.step label{font-size:13px;color:#6B5644;display:block}
.step div{display:flex;align-items:center;justify-content:space-between}
.step button{width:44px;height:44px;border:3px solid #2B1D14;background:#E8D2A6;font:700 20px ui-monospace,monospace;cursor:pointer}
.step output{font:700 22px ui-monospace,monospace}
.liters{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.liters strong{font:700 36px Alegreya,serif;color:#3E6FB0}
.bottles{display:flex;flex-wrap:wrap;gap:1px;margin-top:4px}
.bottles svg{width:20px;height:20px}
.menu .day{display:flex;gap:10px;padding:8px 0;border-bottom:2px dashed #DCC9AE}
.menu .day:last-child{border:0}
.menu .d{font:700 12px ui-monospace,Menlo,monospace;background:#5E6B24;color:#FBF6EC;padding:4px 6px;height:max-content;min-width:54px;text-align:center}
.menu .m{font-size:15px;line-height:1.35}
.menu .m i{font-style:normal;color:#6B5644}
.dlg .eat{font:12px ui-monospace,Menlo,monospace;color:#6B5644;margin-top:8px}
.quest{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:2px dashed #DCC9AE}
.quest svg{width:34px;height:34px;flex:none}
.quest .t{flex:1}
.quest .t b{display:block;font-size:16px}
.quest .t span{font-size:13.5px;color:#6B5644}
.quest .ck{width:22px;height:22px;border:3px solid #2B1D14;background:#FBF6EC;position:relative;flex:none}
.slide.on .quest .ck::after{content:"✓";position:absolute;inset:-6px 0 0 1px;font:900 20px/1 system-ui,sans-serif;color:#3F6E2C;animation:pop .2s steps(2) both;animation-delay:calc(var(--d) + .3s)}
.big{display:block;width:100%;height:52px;border:3px solid #2B1D14;background:#FFD54A;font:700 17px "Alegreya Sans",sans-serif;cursor:pointer;margin-top:8px;box-shadow:inset -3px -3px 0 #C08A1E}
.link{display:block;width:100%;height:44px;border:0;background:none;text-decoration:underline;font-size:15px;color:#4A2C1A;cursor:pointer}
.recap{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.recap span{background:#F4EBDB;border:2px solid #DCC9AE;padding:5px 8px;font-size:14px}

/* scene loops */
.glow{animation:bl 2.4s steps(2) infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.55}}
.smoke{animation:rise 3s steps(6) infinite;animation-delay:var(--d,0s)}
@keyframes rise{from{transform:translate(0,0);opacity:.9}to{transform:translate(8px,-36px);opacity:0}}
.leaf{animation:fall 5s steps(10) infinite;animation-delay:var(--d,0s)}
@keyframes fall{from{transform:translate(0,-30px)}50%{transform:translate(10px,60px)}to{transform:translate(-4px,150px);opacity:0}}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.fa{animation:fa .5s steps(1) infinite}.fb{animation:fb .5s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}@keyframes fb{0%{opacity:0}50%{opacity:1}}
.zz{animation:rise 2.6s steps(5) infinite;animation-delay:var(--d,0s)}
.twinkle{animation:bl 1.6s steps(2) infinite;animation-delay:var(--d,0s)}
.slide.on .drop{animation:drop .5s steps(5,end) both;animation-delay:var(--d,0s)}
@keyframes drop{from{transform:translateY(-80px);opacity:0}70%{transform:translateY(4px);opacity:1}to{transform:none}}
.drip{animation:drip 1.2s steps(6) infinite}
@keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(30px);opacity:0}}
.slide.on .zip{animation:zip 1s steps(6,end) .3s both;transform-box:fill-box;transform-origin:right}
@keyframes zip{from{transform:scaleX(0)}to{transform:none}}
.wave{animation:fa .6s steps(1) infinite}

/* ---------- quick list (follows light/dark) ---------- */
.quick{background:var(--bg);overflow:auto}
.qhead{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.qhead h1{font:700 22px Alegreya,serif;margin:0;color:var(--forest);flex:1}
.qhead small{display:block;font:14px "Alegreya Sans",sans-serif;color:var(--muted)}
.qhead button{height:44px;padding:0 12px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;cursor:pointer;font-weight:500}
.qbody{padding:12px 12px 30px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{font:700 19px Alegreya,serif;margin:0 0 6px;color:var(--forest);display:flex;align-items:center;gap:8px}
.card h3 svg{width:24px;height:24px}
.card ul{margin:0;padding-left:20px;line-height:1.45}
.card.w{background:var(--warn-soft);border-color:var(--warn)}
.card.w h3{color:var(--warn)}
.card p{margin:0 0 4px;line-height:1.4}
.prog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:4px}
.prog i{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.prog i b{display:block;height:100%;background:var(--ok);transition:width .2s}
.checks{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
.check{display:flex;align-items:center;gap:8px;min-height:44px;border-top:1px solid var(--line);cursor:pointer;font-size:15px;line-height:1.15}
.check input{width:22px;height:22px;accent-color:var(--ok)}
.check.done span{text-decoration:line-through;color:var(--muted)}
.qtable{width:100%;border-collapse:collapse;font-size:15px}
.qtable td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.qtable td:first-child{font-weight:700;white-space:nowrap;color:var(--moss);width:68px}
.qbtn{height:48px;border-radius:12px;border:0;background:var(--forest);color:var(--surface);font-weight:700;font-size:16px;cursor:pointer}

/* ---------- entry on the map (mock) ---------- */
.entry{background:#8E9B48}
.entry svg{display:block;width:100%}
.hud{position:absolute;left:0;right:0;bottom:0;height:86px;background:#5C4033;border-top:4px solid #2B1D14;padding:8px 10px;display:flex;gap:8px;align-items:center}
.hud .si{flex:1;background:#E8D2A6;border:3px solid #2B1D14;padding:6px 8px;font:13px ui-monospace,Menlo,monospace}
.toast{position:absolute;left:10px;right:10px;bottom:98px;background:#FBF6EC;border:3px solid #2B1D14;box-shadow:0 0 0 2px #FFD54A;display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;animation:pop .32s steps(4) .6s both}
.toast svg{width:40px;height:40px;flex:none}
.toast b{font:700 16px Alegreya,serif;display:block}
.toast span{font-size:13.5px;color:#6B5644}
.toast em{margin-left:auto;font:700 20px ui-monospace,monospace;font-style:normal}

/* ---------- adventure ---------- */
.adv{background:#8E9B48;user-select:none;-webkit-user-select:none;color:#2B1D14}
.advworld{position:absolute;inset:0 0 68px 0;overflow:hidden;background:#8E9B48}
.advworld svg{display:block;width:100%;height:auto;will-change:transform}
.spot .ring,.spot .marker{display:none}
.spot.next .ring{display:inline;animation:bl .8s steps(2) infinite}
.spot.next .marker{display:inline}
.spot.next .name{display:none}
.spot.next .arrow{animation:bob .6s steps(2) infinite}
.spot .ckb{display:none}.spot.done .ckb{display:inline}
.advtip{position:absolute;top:10px;left:10px;right:10px;z-index:3;background:#FBF6EC;border:3px solid #2B1D14;box-shadow:0 0 0 2px #FFD54A;display:flex;gap:8px;align-items:center;padding:6px 10px;font-size:15.5px;line-height:1.25;min-height:48px}
.advtip svg{width:30px;height:30px;flex:none}
.stage.on{z-index:5}
.stage h2{outline:none}
.stage .back{left:10px;right:auto;top:10px}
.advprog{display:flex;gap:3px}
.advprog span{width:28px;height:28px;background:#3A2A1E;border:2px solid #2B1D14;display:grid;place-items:center}
.advprog span svg{width:20px;height:20px;opacity:.25;filter:grayscale(1)}
.advprog span.got{background:#E8D2A6}
.advprog span.got svg{opacity:1;filter:none}
.adv .nav .nextb{font-size:14px}

/* side panel next to the yard, desktop only */
.advside{display:none;position:absolute;left:444px;right:0;top:0;bottom:68px;background:#1E1712;flex-direction:column;padding-top:8px}
.advst{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.advst.got{border-color:#3F6E2C;background:#DCE6C2}
.advst .chip{margin-left:auto;background:#3F6E2C}

/* ---------- desktop: the yard and the station side by side ---------- */
@media (min-width:900px){
  .phone{width:min(1120px,94vw);height:min(780px,calc(100vh - 90px));border-radius:18px}
  .advworld{right:auto;width:440px;border-right:4px solid #2B1D14}
  .advtip{right:auto;width:420px}
  .advside{display:flex}
  .nav .nextb{flex:0 1 340px;margin-left:auto}
  .adv .stage{left:444px}
  .adv .stage .back{display:none}
  .adv .stage .scene{flex:0 0 auto;height:36%;min-height:0}
  .adv .stage .dlg{flex:1 1 auto;max-height:none}
  .adv .stage .grid{grid-template-columns:repeat(5,1fr)}
  .deck .slide{flex-direction:row}
  .deck .slide .scene{flex:1 1 56%;height:100%;min-height:0}
  .deck .slide .dlg{flex:0 0 42%;max-height:none;margin:8px}
  .qbody{display:grid;grid-template-columns:1fr 1fr;align-items:start;max-width:980px;margin:0 auto}
  .qbody .card.w,.qbody .qbtn{grid-column:1/-1}
  .entry svg{max-width:440px;margin:0 auto}
}

.rm *,.rm *::after{animation:none!important}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.notes{max-width:380px;color:#cbb9a4;font-size:13.5px;line-height:1.45;padding:0 10px}
</style>
</head>
<body>
<div class="tools" role="toolbar" aria-label="Návrh">
  <button data-view="adv" aria-pressed="true">Dobrodružstvo</button>
  <button data-view="deck" aria-pressed="false">Prezentácia</button>
  <button data-view="quick" aria-pressed="false">Rýchly prehľad</button>
  <button data-view="entry" aria-pressed="false">Vstup z mapy</button>
  <button id="themeBtn">Tmavý režim</button>
  <button id="rmBtn" aria-pressed="false">Bez animácií</button>
</div>

<div class="phone" id="phone">
  <section class="view adv on" id="adv" aria-label="Pred cestou: dvor pri chate"></section>
  <section class="view deck" id="deck" aria-roledescription="prezentácia" aria-label="Pred cestou na chatu">
    <div class="bars" id="bars"></div>
    <button class="skip" id="skip">Len zoznam ☰</button>
    <div id="slides"></div>
    <div class="nav">
      <button class="prevb" id="prevb" aria-label="Späť">‹</button>
      <span class="count" id="count"></span>
      <button class="nextb" id="nextb">Ďalej ›</button>
    </div>
  </section>
  <section class="view quick" id="quick" aria-label="Rýchly prehľad"></section>
  <section class="view entry" id="entry" aria-label="Vstup z mapy"></section>
</div>

<p class="notes">Návrh mimo aplikácie. Texty sú ukážkové a doplní ich organizátor. Prezentácia má pevné farby scény, rýchly prehľad sa riadi svetlým a tmavým režimom ako panely.</p>

<script>
'use strict';
// Sample content. In the app this would come from config (e.g. config/info.yaml) inside /api/state.
const INFO = {
  title: 'Chata 29. 10. – 1. 11.',
  sub: 'Št 29. 10. – Ne 1. 11. 2026 · 3 noci',
  party: { name: 'Ivan a Eva', people: 3, nights: 3, bed: 'Matrace na zemi', room: 'Konica, dole', mats: true },
  pack: [
    ['spacak', 'Spacák'], ['vankus', 'Vankúš'], ['papuce', 'Papuče'], ['mikina', 'Teplá mikina'],
    ['bunda', 'Bunda do dažďa'], ['topanky', 'Pevné topánky'], ['uterak', 'Uterák'], ['hygiena', 'Hygiena'],
    ['celovka', 'Čelovka'], ['lieky', 'Lieky'], ['baterka', 'Nabíjačka'], ['kocka', 'Hra alebo karty'],
  ],
  sleep: [
    ['spacak', 'Spacák', 'každý vlastný, aj deti'],
    ['plachta', 'Plachta na matrac', 'matrace a postele sú bez obliečok'],
    ['vankus', 'Vankúš', 'alebo aspoň obliečka na vankúš'],
  ],
  waterPerDay: 2, bottle: 1.5,
  menu: [
    ['Št 29.', [['večer', 'guláš z kotlíka']]],
    ['Pi 30.', [['ráno', 'raňajky si robí každý sám'], ['večer', 'zapekané zemiaky']]],
    ['So 31.', [['obed', 'tekvicová polievka'], ['večer', 'opekačka pri ohni']]],
    ['Ne 1.', [['ráno', 'palacinky, potom upratujeme']]],
  ],
  eat: 'Na jedlo: Št 12 · Pi 16 · So 18 · Ne 15 ľudí',
  bring: 'raňajky pre svoju partiu, niečo na opekanie a pochutiny alebo koláč',
  program: [
    ['smernik', 'Túra na vyhliadku', 'Pi doobeda · pevné topánky'],
    ['lezenie', 'Lezenie', 'Pi poobede, pre veľkých aj malých'],
    ['lopta', 'Loptové hry', 'So doobeda na lúke'],
    ['ohen', 'Opekačka a oheň', 'So večer'],
    ['lampion', 'Lampiónový sprievod', 'So po zotmení · vezmi lampión'],
    ['truhla', 'Hľadanie pokladu', 'Ne ráno, pre deti'],
    ['kocka', 'Spoločenské hry', 'každý večer'],
  ],
};

// packing list = what to bring + bedding + water; ticks persist on this phone
function packItems() {
  return [...INFO.pack, ['plachta', 'Plachta na matrac'], ...(INFO.party.mats ? [['karimatka', 'Karimatka']] : []), ['flasa', 'Balená voda']];
}
const packed = new Set(JSON.parse(localStorage.getItem('info-packed') || '[]'));
function togglePacked(label, on = !packed.has(label)) {
  on ? packed.add(label) : packed.delete(label);
  localStorage.setItem('info-packed', JSON.stringify([...packed]));
}

// ---------- pixel art ----------

const OVER = { bunda: { o: '#3E6FB0', O: '#2A4E80' } };
const NS = 'http://www.w3.org/2000/svg';
function S(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function R(p, x, y, w, h, f, cls) { const r = S('rect', { x, y, width: w, height: h, fill: f }, p); if (cls) r.setAttribute('class', cls); return r; }
function spr(p, name, x, y, s, cls, over) {
  const g = S('g', cls ? { class: cls } : {}, p);
  const o = over || OVER[name] || {};
  SPR[name].forEach((row, j) => {
    let i = 0;
    while (i < row.length) {           // merge runs of one color into one rect
      const ch = row[i]; let n = 1;
      while (row[i + n] === ch) n++;
      if (ch !== '.') R(g, x + i * s, y + j * s, n * s, s, o[ch] || PAL[ch]);
      i += n;
    }
  });
  return g;
}
function icon(name) {
  const size = SPR[name][0].length;
  const svg = S('svg', { viewBox: `0 0 ${size} ${size}`, 'shape-rendering': 'crispEdges', 'aria-hidden': 'true' });
  spr(svg, name, 0, 0, 1);
  return svg;
}
// adult/kid figure, same shapes as the map
function fig(p, x, y, c, s, kid) {
  const g = S('g', {}, p);
  if (kid) { R(g, x + s, y + 3 * s, 8 * s, 6 * s, c); R(g, x + 2 * s, y, 6 * s, 4 * s, '#F2C9A0'); }
  else { R(g, x, y + 5 * s, 10 * s, 7 * s, c); R(g, x + 2 * s, y, 6 * s, 5 * s, '#F2C9A0'); R(g, x + 3 * s, y + 2 * s, s, s, '#3A2A1E'); R(g, x + 6 * s, y + 2 * s, s, s, '#3A2A1E'); }

}
function H(tag, cls, text, parent) {

function grass(p, y) {
  R(p, 0, y, 380, 210 - y, '#8E9B48');

// ---------- deck controller ----------
const host = document.getElementById('slides'), bars = document.getElementById('bars');
let cur = 0;
slides.forEach((s, i) => {
  const el = H('div', 'slide', null, host);
  el.setAttribute('role', 'group'); el.setAttribute('aria-roledescription', 'snímka'); el.setAttribute('aria-label', `${i + 1} z ${slides.length}`);
  const svg = scene(); s.draw(svg); el.appendChild(svg);
  svg.style.background = svg.querySelector('rect').getAttribute('fill'); // sky continues above the picture
  s.panel(H('div', 'dlg', null, el));
  s.el = el; H('i', null, null, bars);
});
function go(i, back) {
  if (i < 0 || i >= slides.length) return;
  const old = slides[cur].el;
  slides.forEach(s => s.el.classList.remove('on', 'prev', 'back'));
  if (i !== cur) old.classList.add('prev');
  const el = slides[i].el;
  void el.offsetWidth;                      // restart build animations
  el.classList.add('on'); if (back) el.classList.add('back');
  el.querySelector('.dlg').scrollTop = 0;
  setTimeout(() => old !== el && old.classList.remove('prev'), 450);
  cur = i;
  [...bars.children].forEach((b, j) => b.classList.toggle('done', j <= i));
  document.getElementById('count').textContent = `${i + 1}/${slides.length}`;
  document.getElementById('prevb').disabled = i === 0;
  document.getElementById('nextb').textContent = i === slides.length - 1 ? 'Na mapu ›' : 'Ďalej ›';
}
function next() { cur === slides.length - 1 ? show('entry') : go(cur + 1); }
function prev() { go(cur - 1, true); }
document.getElementById('nextb').onclick = next;
document.getElementById('prevb').onclick = prev;
document.getElementById('skip').onclick = () => show('quick');
// tap on the picture: left third back, rest forward; swipe left/right
let sx = null;
host.addEventListener('pointerdown', e => { sx = e.clientX; });
host.addEventListener('pointerup', e => {
  if (sx == null || e.target.closest('button,input,label,.dlg')) { sx = null; return; }
  const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 40) return dx < 0 ? next() : prev();
  const r = host.getBoundingClientRect();
  (e.clientX - r.left < r.width / 3) ? prev() : next();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('deck').classList.contains('on')) return;
  if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') prev();
});

  const sbtns = ST.map((st, i) => {
    const b = H('button', 'row advst', null, srows); b.appendChild(icon(st.icon));
    const tx = H('div', null, null, b); H('b', null, st.label, tx); H('span', null, slideTitle(st.panel), tx);
    b.onclick = () => goTo(i);
    return b;
  });
  const tip = H('div', 'advtip', null, v); tip.setAttribute('role', 'status');
  const tipIcon = icon('batoh'); tip.appendChild(tipIcon); const tipText = H('span', null, '', tip);
  const sheet = H('div', 'slide stage', null, v); sheet.setAttribute('role', 'dialog');

  const nav = H('div', 'nav', null, v);
  const list = H('button', 'prevb', '☰', nav); list.setAttribute('aria-label', 'Rýchly zoznam'); list.onclick = () => show('quick');
  const prog = H('div', 'advprog', null, nav); prog.setAttribute('aria-label', 'Nájdené');
  const pslots = ST.map(st => { const s = H('span', null, null, prog); s.appendChild(icon(st.icon)); s.title = st.label; return s; });
  const nextb = H('button', 'nextb', '', nav);
  nextb.onclick = () => { if (adv.sheet && !isWide()) closeSheet(); else if (adv.sheet && adv.open === 'end') closeSheet(); else if (adv.done.size === ST.length) openSheet('end'); else goTo(nextIndex()); };

  advEls = { world, svg, spots, me, body, tip, tipText, tipIcon, sheet, nextb, pslots, sbtns };
  adv.at = -1; adv.pos = START.slice(); adv.done.clear(); adv.sheet = false; adv.walking = false;
  place(); refresh(); requestAnimationFrame(() => camera(false));
}
function slideTitle(p) { return ({ 1: 'čo si zbaliť', 2: 'na čom sa spí', 3: 'pitná voda', 4: 'čo sa bude variť', 5: 'program' })[p]; }
function nextIndex() { for (let i = 0; i < ST.length; i++) if (!adv.done.has(i)) return i; return ST.length - 1; }

function isWide() { return matchMedia('(min-width: 900px)').matches; }
addEventListener('resize', () => { if (advEls) { refresh(); camera(false); } });
function refresh() {
  const n = adv.done.size === ST.length ? -1 : nextIndex();
  advEls.spots.forEach((g, i) => { g.classList.toggle('next', i === n && (!adv.sheet || isWide())); g.classList.toggle('done', adv.done.has(i)); });
  advEls.pslots.forEach((s, i) => s.classList.toggle('got', adv.done.has(i)));
  const end = adv.sheet && adv.open === 'end';
  advEls.sbtns.forEach((b, i) => {
    b.classList.toggle('got', adv.done.has(i)); b.querySelector('.chip')?.remove();
    if (adv.done.has(i)) H('span', 'chip', '✓', b);
  });
  // on desktop the yard stays visible, so the button keeps leading to the next stop
  advEls.nextb.textContent = adv.sheet && (!isWide() || end) ? '‹ Späť na dvor' : n < 0 ? 'Hotovo ›' : `Choď: ${ST[n].label} ›`;
  const first = adv.done.size === 0 && adv.at < 0;
  const txt = end ? 'Hotovo! Dvor si môžeš kedykoľvek prejsť znova.' : adv.sheet && !isWide() ? 'Prečítaj si to. Potom ťukni na dvor a vyber si ďalšiu vec.' : n < 0 ? 'Máš všetko! Ťukni na hocičo a pozri si to znova.' : first ? 'Ťukni na to, čo bliká, a dôjdem tam.' : ST[n].hint;
  advEls.tipText.textContent = txt;
  advEls.tipIcon.replaceWith(advEls.tipIcon = icon(adv.sheet && !isWide() ? (ST[adv.open] ? ST[adv.open].icon : 'truhla') : n < 0 ? 'truhla' : ST[n].icon));
  advEls.tip.prepend(advEls.tipIcon);
}
// a tap on the yard only hides the open card, so the map can be tapped again
function advance() {
  if (adv.walking || !adv.sheet) return;
  closeSheet();
}
function place() {
  const [x, y] = adv.pos;
  advEls.me.setAttribute('transform', `translate(${Math.round(x / 2) * 2 - 10} ${Math.round(y / 2) * 2 - 24})`);
}
function camera(anim) {
  const { world, svg, sheet } = advEls;
  const s = svg.clientWidth / ADV_W, H0 = world.clientHeight;
  const covered = 0;
  const view = H0 - covered;
  // follow the figure; a short world sits at the bottom so the tip never covers the cabin
  const lo = H0 - covered - ADV_H * s, hi = Math.max(0, H0 - ADV_H * s);
  const ty = Math.max(lo, Math.min(hi, view * 0.55 - adv.pos[1] * s));
  svg.style.transition = anim ? 'transform .45s steps(6,end)' : 'none';
  svg.style.transform = `translateY(${Math.round(ty)}px)`;
}
function goTo(i) {
  if (adv.walking) return;
  if (adv.sheet) closeSheet(true);
  const a = chainIdx(adv.at), b = chainIdx(i);
  const route = a <= b ? CHAIN.slice(a, b + 1) : CHAIN.slice(b, a + 1).reverse();
  adv.at = i;
  walk(route.slice(1), () => openSheet(i));
}
function walk(points, done) {
  if (!points.length || noMotion()) { if (points.length) adv.pos = points[points.length - 1].slice(); place(); camera(false); return done(); }
  adv.walking = true; advEls.body.classList.add('bob'); advEls.spots.forEach(g => g.classList.remove('next'));
  let k = 0, last = performance.now();
  const speed = 150; // px per second in world units
  const step = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let left = speed * dt;
    while (left > 0 && k < points.length) {
      const [tx, ty] = points[k], dx = tx - adv.pos[0], dy = ty - adv.pos[1], d = Math.hypot(dx, dy);
      if (d <= left) { adv.pos = [tx, ty]; left -= d; k++; }
      else { adv.pos = [adv.pos[0] + dx / d * left, adv.pos[1] + dy / d * left]; left = 0; }
    }
    place(); camera(false);
    if (k < points.length) requestAnimationFrame(step);
    else { adv.walking = false; advEls.body.classList.remove('bob'); done(); }
  };
  requestAnimationFrame(step);
}
function openSheet(i) {
  // the station opens as a full presentation slide: picture on top, text below
  const sh = advEls.sheet; sh.replaceChildren(); sh.classList.remove('on');
  const src = slides[i === 'end' ? slides.length - 1 : ST[i].panel];
  const svg = scene(); src.draw(svg); sh.appendChild(svg);
  svg.style.background = svg.querySelector('rect').getAttribute('fill');
  const d = H('div', 'dlg', null, sh);
  if (i === 'end') endPanel(d);
  else {
    src.panel(d);
    const k = d.querySelector('.kick'); if (k) k.textContent = `${ST[i].label} · ${i + 1} z ${ST.length}`;
    adv.done.add(i);
  }
  const back = H('button', 'skip back', '‹ Dvor', sh); back.onclick = () => closeSheet();
  sh.setAttribute('aria-label', d.querySelector('h2')?.textContent || '');
  void sh.offsetWidth; sh.classList.add('on');
  adv.sheet = true; adv.open = i; refresh();
  sh.querySelector('h2')?.setAttribute('tabindex', '-1'); sh.querySelector('h2')?.focus({ preventScroll: true });
}
function closeSheet(silent) {
  const was = adv.open;
  advEls.sheet.classList.remove('on'); adv.sheet = false; refresh();
  if (silent) return;
  if (was !== 'end' && adv.done.size === ST.length) return openSheet('end');
  camera(true);
}
function endPanel(d) {
  H('p', 'kick', 'Hotovo', d);
  build(H('h2', null, 'Máš všetko, vidíme sa na chate!', d), 0);
  const rc = H('div', 'recap', null, d);
  ['Spacák, vankúš, plachta', `Balená voda ${fmt(INFO.waterPerDay)} l na deň`, 'Teplé veci a topánky', 'Niečo na raňajky'].forEach((t, i) => build(H('span', null, t, rc), i + 1));
  const a = build(H('button', 'big', 'Na mapu postelí', d), 5); a.onclick = () => show('entry');
  const q = build(H('button', 'link', 'Zoznam na zbalenie', d), 6); q.onclick = () => show('quick');
  const r = build(H('button', 'link', 'Prejsť dvor znova', d), 7); r.onclick = buildAdv;
}

// ---------- design toolbar ----------
function show(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === v));
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  if (v === 'quick') buildQuick();
  if (v === 'entry') buildEntry();
  if (v === 'adv') buildAdv();
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { show(b.dataset.view); if (b.dataset.view === 'deck') go(0); });
const phone = document.getElementById('phone');
const themeBtn = document.getElementById('themeBtn');
function setTheme(t) { phone.dataset.theme = t; themeBtn.textContent = t === 'dark' ? 'Svetlý režim' : 'Tmavý režim'; }
setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
themeBtn.onclick = () => setTheme(phone.dataset.theme === 'dark' ? 'light' : 'dark');
document.getElementById('rmBtn').onclick = e => { const on = phone.classList.toggle('rm'); e.target.setAttribute('aria-pressed', String(on)); };
go(0);
buildAdv();
</script>
</body>
</html>
