# Guest info for the „Pred cestou“ section. Texts are organizer data (Slovak), like room names.
# Icons come from a fixed set (see INFO_ICONS in app/models.py). Days are quoted ISO dates.
# Optional: pack_intro, sleep_intro, food_intro, food_note, host_arrival, food_plan, facilities, menu, bring, route, and a program item's when and note.
enabled: true            # false: the whole „Pred cestou“ section is hidden (board, yard, progress, „Čo kto donesie“)
water:
  drinkable: false        # false: the page shows the warning that tap water is not drinkable
  liters_per_day: 2
  bottle_liters: 1.5
host_arrival: "Lukáš príde na chatu okolo 17:00."
route:                    # optional: the map link (https only) and a note on the way
  maps_url: "https://maps.app.goo.gl/Ek35aVpJAqSyYfDf7"
  note: "Choď cez Detvu, smer ‚Detva Stavanisko‘. Inak ťa navigácia môže poslať inou cestou."
