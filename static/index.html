    }
    if (app.zoomCleanup) app.zoomCleanup();      // the layout was redrawn: drop the old svg's window listeners
    window.addEventListener("pointerup", release);
    window.addEventListener("pointercancel", release);
    function onResize() { refit(false); }
    window.addEventListener("resize", onResize);
    var observer = typeof ResizeObserver === "function" ? new ResizeObserver(onResize) : null;
    var moveBar = $("moveBar");
    if (observer) { observer.observe(host); observer.observe(moveBar); }      // the bar shows, hides and wraps
    app.refit = function () { refit(false); };
    app.zoomCleanup = function () {
      window.removeEventListener("pointerup", release);
      window.removeEventListener("pointercancel", release);
      window.removeEventListener("resize", onResize);
      if (observer) observer.disconnect();
    };

    svg.addEventListener("click", function (e) {
      if (!app.blockClick) return;
      app.blockClick = false;
      e.stopPropagation();
      e.preventDefault();
    }, true);

    svg.addEventListener("wheel", function (e) {
      e.preventDefault();       // the page neither scrolls nor zooms over the map
      zoomAround(wheelFactor(e.deltaY, e.deltaMode, e.ctrlKey), e.clientX, e.clientY);
    }, { passive: false });

    // Safari on a Mac sends a trackpad pinch as gesture events, not as wheel events.
    svg.addEventListener("gesturestart", function (e) {
      e.preventDefault();
      gestureScale = 1;
      endPress();
    });
    svg.addEventListener("gesturechange", function (e) {
      e.preventDefault();
      endPress();
      if (ids().length || !(e.scale > 0)) return;     // fingers handled by the pointer events are not zoomed twice
      zoomAround(e.scale / gestureScale, e.clientX, e.clientY);
      gestureScale = e.scale;
    });
    svg.addEventListener("gestureend", function (e) {
      e.preventDefault();
      endPress();
    });

    // With two or more fingers the page must neither scroll nor zoom: the browser would otherwise claim an uneven
    // pinch (one finger still) as a scroll and cancel the pointers.
    function holdTwoFingers(e) {
      if (e.touches.length >= 2 && e.cancelable) e.preventDefault();
    }
    svg.addEventListener("touchstart", holdTwoFingers, { passive: false });
    svg.addEventListener("touchmove", holdTwoFingers, { passive: false });

    svg.addEventListener("keydown", function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var c = { x: app.view.x + app.view.w / 2, y: app.view.y + app.view.h / 2 };
      if (e.key === "+" || e.key === "=") setView(zoomView(app.view, app.bounds, ZOOM_KEY_STEP, c.x, c.y));
      else if (e.key === "-" || e.key === "_") setView(zoomView(app.view, app.bounds, 1 / ZOOM_KEY_STEP, c.x, c.y));
      else if (e.key === "0") resetView();
      else return;
      revealFocused();
      e.preventDefault();
    });

    // A bed reached with Tab must be in view. A tap or click, or focus returning after a panel closes, must not
    // shift the map under the finger.
    svg.addEventListener("focusin", function (e) {
      var node = e.target;
      if (!resetShown(app.view, app.bounds) || !node.getBBox || Date.now() - app.navKeyAt > 500) return;
      try {
        if (!node.matches(":focus-visible")) return;
        var b = node.getBBox();
        setView(revealRect(app.view, app.bounds, [b.x, b.y, b.width, b.height], 6));
      } catch (err) { /* not measurable: leave the view */ }
    });

    app.zoomReset.addEventListener("click", function () {
      resetView();
      svg.focus({ preventScroll: true });
    });
  }

  // The grass around the scene, as far as the view shows it even zoomed out to ZOOM_MIN: a patterned rectangle.
  // The scene's own grass is drawn over it, so the two meet without a seam.
  function drawGround(g, bounds) {
    var pattern = g.querySelector("pattern");
    if (!pattern) {
      var defs = svgEl(g, "defs", {});
      pattern = svgEl(defs, "pattern", { id: "grassTile", width: GRASS_TILE, height: GRASS_TILE, patternUnits: "userSpaceOnUse" });
      rect(pattern, 0, 0, GRASS_TILE, GRASS_TILE, COLORS.grass);
      GRASS_TUFTS.forEach(function (t, k) { rect(pattern, t[0], t[1], 4, 4, k === 1 ? COLORS.leafRust : k === 4 ? COLORS.leafOchre : k === 6 ? COLORS.leafRed : COLORS.tuft); });
      svgEl(g, "rect", { "class": "ground", fill: "url(#grassTile)" });
    }
    var r = g.querySelector(".ground");
    var gr = groundRect(bounds);
    r.setAttribute("x", gr[0]);
    r.setAttribute("y", gr[1]);
    r.setAttribute("width", gr[2]);
    r.setAttribute("height", gr[3]);
  }

  function drawBase(g, layout) {
    var W = layout.map.viewbox[0], H = layout.map.viewbox[1], i;
    rect(g, 0, 0, W, H, COLORS.grass);
    for (i = 0; i < 70; i++) rect(g, (i * 53) % (W - 8), (i * 97) % (H - 8), 4, 4, i % 4 === 1 ? COLORS.leafRust : i % 4 === 3 ? COLORS.leafOchre : COLORS.tuft);
    layout.map.paths.forEach(function (p) { rect(g, p[0], p[1], p[2], p[3], COLORS.path); });
    layout.rooms.forEach(function (room) {
      var r = room.rect;
      rect(g, r[0], r[1], r[2], r[3], COLORS.roomEdge);
      rect(g, r[0] + 4, r[1] + 4, r[2] - 8, r[3] - 8, room.floor);
      addText(g, r[0] + 7, r[1] + 16, room.name, 11, COLORS.roomLabel, { maxWidth: r[2] - 14 });
    });
    layout.map.doors.forEach(function (d) {
      rect(g, d[0], d[1], d[2], d[3], doorFloorColor(layout, d) || COLORS.path);
    });
    layout.map.windows.forEach(function (w) { rect(g, w[0], w[1], w[2], w[3], COLORS.window); });
  }

  // The element below `root` with this data-key, or null.
  function byKey(root, key) {
    var found = null;
    Array.prototype.forEach.call(root.querySelectorAll("[data-key]"), function (node) {
      if (node.getAttribute("data-key") === key) found = node;
    });
    return found;
  }

  // Runs `redraw`, which rebuilds the nodes below `root`, and gives keyboard focus back to the element
  // with the same data-key. If that element is gone, focus goes to `fallback(root)` when given.
  function keepFocus(root, redraw, fallback) {
    var active = document.activeElement;
    var key = active && root.contains(active) && active.getAttribute ? active.getAttribute("data-key") : null;
    redraw();
    if (!key) return;
    var again = byKey(root, key) || (fallback ? fallback(root) : null);
    if (again && again.focus) again.focus({ preventScroll: true });
  }

  function render() {
    if (!app.state || app.codeOpen || !app.introDone) return;     // the code screen and the loading view come first
    ensureScene();
    keepFocus($("scene"), function () {
      drawBoards();
      drawBeds();
    });
    renderSummary();
    renderMoveBar();
  }

  // The visually hidden text summary for screen readers: the same data as the map, for the selected night.
  // It is built from the state the map draws (with unconfirmed changes), not from the plain server state.
  function renderSummary() {
    var host = $("srSummary"), h = hiddenSummary(viewState().state, app.night);
    clearNode(host);
    host.appendChild(htmlEl("h2", null, h.title));
    host.appendChild(htmlEl("p", null, h.dates));
    host.appendChild(htmlEl("p", null, "Návod: " + h.instructions.join(" ")));
    host.appendChild(htmlEl("h3", null, h.night));
    h.rooms.forEach(function (room) {
      host.appendChild(htmlEl("h4", null, room.name));
      var list = htmlEl("ul");
      room.beds.forEach(function (bed) { list.appendChild(htmlEl("li", null, bed.name + ": " + bed.text)); });
      host.appendChild(list);
    });
    host.appendChild(htmlEl("h3", null, "Partie po nociach"));
    var parties = htmlEl("ul");
    var lines = partyTableSummary(app.state, app.myParty);
    if (!lines.length) lines = ["Zatiaľ tu nikto nie je."];
    lines.forEach(function (line) { parties.appendChild(htmlEl("li", null, line)); });
    host.appendChild(parties);
  }

  function renderBoards() {
    keepFocus($("scene"), drawBoards);
  }

  function renderBeds() {
    keepFocus($("scene"), drawBeds);
  }

  function drawBoards() {
    var state = app.state, scene = state.layout.map.scene;
    var g = app.layers.boards;
    clearNode(g);
    app.ageNode = null;
    drawTitle(g, scene.title, state);
    drawNights(g, scene, state);
    drawNotice(g, scene.notice);
    if (app.noticeCollapsed) drawPartyTable(g, scene.parties, state);
    drawStatus(g, scene.status, state);
    drawLetter(g, scene.letter);
    drawLegend(g, scene.legend);
    renderAge();
  }

  // The letter icon opens „Prehľad na poslanie“. The hit area is the whole `map.scene.letter` rect.
  function drawLetter(parent, r) {
    var g = svgEl(parent, "g");
    var x = r[0] + (r[2] - 32) / 2, y = r[1] + (r[3] - 24) / 2;
    rect(g, x, y, 32, 24, COLORS.woodDark);
    rect(g, x + 3, y + 3, 26, 18, COLORS.paper);
    [[0, 0], [4, 3], [8, 6], [12, 9]].forEach(function (p) {      // the flap, from the left corner to the middle
      rect(g, x + 3 + p[0], y + 3 + p[1], 4, 3, COLORS.woodDark);
      rect(g, x + 25 - p[0], y + 3 + p[1], 4, 3, COLORS.woodDark);
    });
    rect(g, x + 13, y + 14, 6, 6, COLORS.red);                  // the seal
    hitRect(g, r);
    makeButton(g, "Prehľad na poslanie. Ťuknutím otvoríš text, ktorý môžeš poslať do WhatsAppu.", "letter", openSummary);
  }

  // The „Kto je kto“ sign: a small board with three colour squares, each next to a paper line. The squares are
  // decoration (the first three palette colours), not party data. The hit area is the whole `map.scene.legend` rect.
  function drawLegend(parent, r) {
    var g = svgEl(parent, "g");
    board(g, r, COLORS.plank);
    var x = r[0] + 7, y = r[1] + 8;
    ["#2F7D6D", "#D07A2B", "#6D5BA8"].forEach(function (color, i) {
      var ry = y + i * 10;
      rect(g, x, ry, 6, 6, color);
      rect(g, x + 10, ry + 1, 16 + (i === 1 ? -4 : i === 2 ? -8 : 0), 4, COLORS.paper);
    });
    hitRect(g, r);
    makeButton(g, "Kto je kto. Ťuknutím uvidíš partie a ich farby.", "legend", function () { openLegend("legend"); });
  }

  function drawTitle(parent, r, state) {
    var g = svgEl(parent, "g", { role: "img", "aria-label": titleLabel(state.event) });
    board(g, r, COLORS.plank);
    // 12 px bold: the baseline sits about 4 units below the middle of the board
    addText(g, r[0] + r[2] / 2, r[1] + r[3] / 2 + 4, state.event.name, 12, COLORS.paper, { anchor: "middle", bold: true, maxWidth: r[2] - 16 });
    rect(g, r[0] + 6, r[1] + 6, 3, 3, COLORS.woodLight);
    rect(g, r[0] + r[2] - 9, r[1] + 6, 3, 3, COLORS.woodLight);
  }

  function drawNights(parent, scene, state) {
    var nights = state.event.nights, gap = 4, lay = signpostLayout(scene.nights, nights.length, gap);
    var total = totalSlots(state.layout);
    var hit = nightsHit(state.layout, NIGHTS_HIT_GROW);
    var party = partyById(state, app.myParty);
    nights.forEach(function (night, i) {
      var info = nightInfo(night) || { label: night, dates: "" };
      var used = usedCount(state, night);
      var selected = night === app.night;
      var b = lay.boards[i], x = b[0], w = b[2];
      var g = svgEl(parent, "g");
      rect(g, x + w / 2 - 3, b[1] + b[3] - 2, 6, 8, COLORS.woodDark);   // post
      board(g, b, selected ? COLORS.selected : COLORS.wood, selected ? COLORS.highlight : COLORS.woodDark);
      var cx = x + w / 2, inner = w - 8;
      addText(g, cx, lay.label, info.label, 9, COLORS.ink, { anchor: "middle", bold: true, maxWidth: inner });
      addText(g, cx, lay.date, info.dates, 6.5, COLORS.ink, { anchor: "middle", maxWidth: inner });
      var tally = party ? nightTally(state, party, night) : null;
      if (tally && tally.kind === "absent") {
        addText(g, cx, lay.absent, tallyChipText(tally), 6.5, COLORS.ink, { anchor: "middle", maxWidth: inner });
      } else if (tally) {
        var tone = TALLY_COLORS[tally.kind];
        rect(g, x + 5, lay.chip[0], w - 10, lay.chip[1], COLORS[tone[0]]);
        rect(g, x + 6, lay.chip[0] + 1, w - 12, lay.chip[1] - 2, COLORS[tone[1]]);
        addText(g, cx, lay.chipText, tallyChipText(tally), 7, COLORS[tone[2]], { anchor: "middle", bold: true, maxWidth: w - 14 });
      }
      addText(g, cx, lay.used, "obsadené", 6.5, COLORS.ink, { anchor: "middle", maxWidth: inner });
      addText(g, cx, lay.total, used + " z " + total, 8, COLORS.ink, { anchor: "middle", bold: true, maxWidth: inner });
      hitRect(g, [x - gap / 2, hit[1], w + gap, hit[3]]);
      makeButton(g, "Noc " + info.label + ", " + info.dates + ", obsadené " + used + " z " + total +
        " miest" + (selected ? ", zvolená noc" : "") + (tally ? ". " + tallyLabel(tally) : ""),
        "night-" + night, function () { selectNight(night); });
      g.setAttribute("aria-pressed", selected ? "true" : "false");
    });
  }

  function drawNotice(parent, r) {
    var g = svgEl(parent, "g");
    if (app.noticeCollapsed) {
      var box = noticeIconRect(r);
      board(g, [box[0] + 4, box[1] + 4, 36, 36], COLORS.plank);
      addText(g, box[0] + 22, box[1] + 30, "?", 22, COLORS.paper, { anchor: "middle", bold: true });
      hitRect(g, box);
      makeButton(g, "Návod. Ťuknutím ho rozbalíš.", "notice", expandNotice);
      return;
    }
    board(g, r, COLORS.paper, COLORS.woodDark);
    rect(g, r[0] + 6, r[1] + 6, 3, 3, COLORS.red);
    rect(g, r[0] + r[2] - 9, r[1] + 6, 3, 3, COLORS.red);
    addText(g, r[0] + 12, r[1] + 20, "Návod", 9, COLORS.ink, { bold: true });
    NOTICE_LINES.forEach(function (line, i) {
      rect(g, r[0] + 12, r[1] + 32 + i * 12, 3, 3, COLORS.red);
      addText(g, r[0] + 20, r[1] + 36 + i * 12, line, 7.5, COLORS.ink, { maxWidth: r[2] - 32 });
    });
    hitRect(g, r);
    makeButton(g, "Návod: " + NOTICE_LINES.join(" ") + " Ťuknutím ho zbalíš.", "notice", collapseNotice);
  }

  // The table of all parties under the signposts, drawn while the noticeboard is collapsed: a row per party
  // (colour square and name), a column per night with placed/needed places. The whole table is one button
  // that opens „Kto je kto“. The numbers are the same nightTally as on the signpost chips.
  function drawPartyTable(parent, r, state) {
    var rows = partyTableRows(state, app.myParty), nights = state.event.nights;
    var lay = partyTableLayout(r, rows.length, nights.length);
    var g = svgEl(parent, "g");
    board(g, r, COLORS.paper, COLORS.woodDark);
    var top = r[1] + lay.pad, innerX = r[0] + lay.pad, innerW = r[2] - 2 * lay.pad;

    // header row: "Partia" and the night labels; the selected night gets the yellow header
    nights.forEach(function (night, i) {
      var info = nightInfo(night) || { label: night };
      if (night === app.night) rect(g, lay.colX[i], top, lay.colW, lay.head, COLORS.selected);
      addText(g, lay.colX[i] + lay.colW / 2, top + 7, info.label, 6, COLORS.ink,
        { anchor: "middle", bold: true, maxWidth: lay.colW - 2 });
    });
    addText(g, lay.nameX + 1, top + 7, "Partia", 6, COLORS.ink, { bold: true, maxWidth: lay.nameW - 2 });
    rect(g, innerX, top + lay.head - 1, innerW, 1, COLORS.woodDark);

    var y0 = top + lay.head;
    if (!rows.length) {
      addText(g, lay.nameX + 1, y0 + lay.rowH / 2 + lay.size * 0.35, "Zatiaľ tu nikto nie je.", lay.size, COLORS.ink,
        { maxWidth: innerW - 2 });
    }
    rows.slice(0, lay.rows).forEach(function (row, i) {
      var y = y0 + i * lay.rowH, base = y + lay.rowH / 2 + lay.size * 0.35;
      if (row.mine) rect(g, innerX, y, innerW, lay.rowH, COLORS.selected);
      rect(g, lay.nameX + 1, y + (lay.rowH - 5) / 2, 5, 5, row.color);
      addText(g, lay.nameX + 8, base, row.label, lay.size, COLORS.ink, { bold: row.mine, maxWidth: lay.nameW - 8 });
      row.cells.forEach(function (cell, j) {
        var cx = lay.colX[j] + lay.colW / 2, tone = TALLY_COLORS[cell.kind];
        if (cell.kind === "under" || cell.kind === "over") {
          var cw = lay.colW - 4, ch = lay.rowH - 1;
          rect(g, cx - cw / 2, y + 0.5, cw, ch, COLORS[tone[0]]);
          rect(g, cx - cw / 2 + 1, y + 1.5, cw - 2, ch - 2, COLORS[tone[1]]);
          addText(g, cx, base, cell.text, lay.size, COLORS[tone[2]], { anchor: "middle", bold: true, maxWidth: cw - 4 });
        } else {
          addText(g, cx, base, cell.text, lay.size, COLORS.ink, { anchor: "middle", maxWidth: lay.colW - 4 });
        }
      });
    });
    if (lay.more) {
      var my = y0 + lay.rows * lay.rowH;
      addText(g, lay.nameX + 1, my + lay.rowH / 2 + lay.size * 0.35, moreText(lay.more), lay.size, COLORS.roomLabel,
        { maxWidth: lay.nameW });
    }
    hitRect(g, r);
    makeButton(g, "Partie a ich miesta po nociach. Ťuknutím otvoríš „Kto je kto“.", "parties", function () { openLegend("parties"); });
  }

  function drawStatus(parent, r, state) {
    var half = r[3] / 2;
    var party = partyById(state, app.myParty);
    var status = myPartyStatus(state, party);

    // top row: who am I and how fresh is the data
    var top = [r[0], r[1], r[2], half];
    var g = svgEl(parent, "g");
    board(g, [top[0], top[1] + 2, top[2], top[3] - 4], COLORS.plank);
    addText(g, top[0] + 8, top[1] + 18, whoText(party), 8, COLORS.paper, { bold: true, maxWidth: r[2] - 16 });
    app.ageNode = addText(g, top[0] + 8, top[1] + 32, "", 6, COLORS.paper, { maxWidth: r[2] - 16 });
    app.ageMax = r[2] - 16;
    hitRect(g, top);
    makeButton(g, (party ? "Si: " + party.name + ". " : "Partia nie je vybratá. ") + "Ťuknutím vyberieš partiu.", "who", openWho);

    // bottom row: the status of my party
    var bot = [r[0], r[1] + half, r[2], half];
    var b = svgEl(parent, "g");
    var inner = [bot[0], bot[1] + 2, bot[2], bot[3] - 4];
    if (status.kind === "missing") {
      board(b, inner, COLORS.red, COLORS.redEdge);
      rect(b, inner[0] + 8, inner[1] + 8, 20, 20, COLORS.white);       // exclamation mark sign
      rect(b, inner[0] + 17, inner[1] + 11, 2, 9, COLORS.red);
      rect(b, inner[0] + 17, inner[1] + 22, 2, 3, COLORS.red);
      drawLines(b, wrapText(status.text, 14, 3), inner[0] + 34, inner[1] + 14, 6.5, COLORS.white, inner[2] - 40);
      hitRect(b, bot);
      makeButton(b, status.text + ". Ťuknutím zvolíš túto noc.", "status", function () { selectNight(status.night); });
    } else if (status.kind === "extra") {
      board(b, inner, COLORS.amber, COLORS.amberEdge);
      drawLines(b, wrapText(status.text, 19, 3), inner[0] + 8, inner[1] + 14, 6.5, COLORS.ink, inner[2] - 16);
      hitRect(b, bot);
      makeButton(b, status.text + ". Ťuknutím zvolíš túto noc.", "status", function () { selectNight(status.night); });
    } else if (status.kind === "ok") {
      board(b, inner, COLORS.green, COLORS.greenEdge);
      [[0, 6], [3, 9], [6, 12], [9, 9], [12, 6], [15, 3], [18, 0]].forEach(function (p) {   // pixel check mark
        rect(b, inner[0] + 10 + p[0], inner[1] + 12 + p[1], 3, 3, COLORS.white);
      });
      addText(b, inner[0] + 38, inner[1] + 23, status.text, 7, COLORS.white, { bold: true, maxWidth: inner[2] - 44 });
      b.setAttribute("role", "img");
      b.setAttribute("aria-label", status.text);
    } else {
      board(b, inner, COLORS.plank);
      drawLines(b, wrapText("Najprv si vyber partiu", 19, 2), inner[0] + 8, inner[1] + 17, 7, COLORS.paper, inner[2] - 16);
      hitRect(b, bot);
      makeButton(b, "Najprv si vyber partiu. Ťuknutím ju vyberieš.", "status", openWho);
    }
  }

  function drawLines(parent, lines, x, y, size, fill, maxWidth) {
    lines.forEach(function (line, i) {
      addText(parent, x, y + i * (size + 2.5), line, size, fill, { maxWidth: maxWidth });
    });
  }

  // --- beds and figures ---

  // The state with the unconfirmed changes on top: {state, pending}.
  function viewState() {
    return withPending(app.state, app.pending);
  }

  // Furniture of a bed by `kind`, ported from `furn()` of the approved preview.
  function drawFurniture(g, bed) {
    var x = bed.rect[0], y = bed.rect[1], w = bed.rect[2], h = bed.rect[3], i;
    switch (bed.kind) {
      case "bed2":
      case "bed1":
      case "cot":
        rect(g, x, y, w, h, COLORS.bedFrame);
        rect(g, x + 2, y + 2, w - 4, h - 4, bed.kind === "cot" ? COLORS.cotFrame : COLORS.sheet);
        rect(g, x + 3, y + 3, w - 6, 6, COLORS.sheetHead);
        if (bed.kind !== "cot") rect(g, x + 2, y + h - 10, w - 4, 8, COLORS.sheetFoot);
        break;
      case "mats":
        for (i = 0; i < bed.slots.length; i++) {
          rect(g, x + i * 46, y, 32, h, COLORS.mat);
          rect(g, x + i * 46 + 2, y + 2, 28, h - 4, COLORS.matTop);
        }
        break;
      case "bunk":
        rect(g, x, y, w, h, COLORS.bunkDark);
        rect(g, x + 2, y + 2, w - 4, 16, COLORS.bunkTop);
        rect(g, x + 2, y + 22, w - 4, 18, COLORS.bunkLow);
        rect(g, x, y + 19, w, 2, COLORS.bunkDark);
        break;
      case "sofa":
      case "sofa1":
        rect(g, x, y, w, h, COLORS.sofaDark);
        rect(g, x + 4, y + 4, w - 8, h - 8, COLORS.sofaLight);
        break;
      case "stove":
        rect(g, x, y, w, h, COLORS.stoveDark);
        rect(g, x + 2, y + 2, w - 4, h - 4, COLORS.stoveLight);
        var pipe = stovePipeRect(bed);
        rect(g, pipe[0], pipe[1], pipe[2], pipe[3], COLORS.stovePipe);
        break;
    }
  }

  // A pixel figure in the party color, ported from `sprite()` of the preview. Kids are smaller.
  function drawFigure(g, px, py, color, kind, ch) {
    if (kind === "kid") {
      rect(g, px + 1, py + 3, 8, 6, color);
      rect(g, px + 2, py, 6, 4, COLORS.skin);
    } else {
      rect(g, px, py + 5, 10, 7, color);
      rect(g, px + 2, py, 6, 5, COLORS.skin);
      rect(g, px + 3, py + 2, 1, 1, COLORS.eye);
      rect(g, px + 6, py + 2, 1, 1, COLORS.eye);
    }
    if (ch) {      // the first letter of the party name, like a print on the shirt (drawn last)
      var at = shirtOrigin(px, py, kind);
      svgEl(g, "path", { d: glyphPath(ch, at[0], at[1]), fill: shirtInk(color), "aria-hidden": "true" });
    }
  }

  function drawBeds() {
    var g = app.layers.beds, layout = app.state.layout;
    var view = viewState();
    clearNode(g);
    layout.rooms.forEach(function (room) {
      room.beds.forEach(function (bed) { drawBed(g, layout, view, room, bed); });
    });
    drawMeadow(g, view);
  }

  // My party's people without a bed on the selected night, standing on the meadow. Not a button.
  function drawMeadow(parent, view) {
    var party = app.myParty ? partyById(view.state, app.myParty) : null;
    var waiting = waitingFigures(view.state, party, app.night);
    if (!waiting.length) return;
    var spot = meadowLayout(view.state.layout.map.scene.meadow, waiting.length);
    var g = svgEl(parent, "g", { role: "img", "aria-label": meadowLabel(waiting.length), "pointer-events": "none" });
    var ch = shirtChar(party.name);
    spot.cells.forEach(function (cell, i) {
      drawFigure(g, cell[0], cell[1], party.color, waiting[i].kind, ch);
    });
    if (spot.morePos) {
      var chip = [spot.morePos[0] - 1, spot.morePos[1], 12, 12];
      board(g, chip, COLORS.plank);
      addText(g, chip[0] + 6, chip[1] + 8.5, "+" + spot.more, 7, COLORS.paper, { anchor: "middle", bold: true });
    }
  }

  function drawBed(parent, layout, view, room, bed) {
    var night = app.night, st = view.state;
    var x = bed.rect[0], y = bed.rect[1], w = bed.rect[2], h = bed.rect[3];
    var g = svgEl(parent, "g", { "class": "bed" });
    hitRect(g, bedHit(layout, bed, BED_HIT_GROW));      // first, so figures keep their hover titles
    drawFurniture(g, bed);
    bed.slots.forEach(function (slot, i) {
      if (app.walking[night + "|" + slot]) return;      // its figure is still walking over from the meadow
      var pos = figurePosition(bed, i), who = slotOccupant(st, slot, night);
      var sg = svgEl(g, "g", view.pending[night + "|" + slot] ? { "class": "pending" } : null);
      if (who) {
        var color = who.party ? who.party.color : COLORS.mat;
        if (who.party && who.party.id === app.myParty) {      // the yellow frame of my party
          rect(sg, pos[0] - 1, pos[1] - 1, 12, 14, "none", { stroke: COLORS.highlight, "stroke-width": 2 });
        }
        svgEl(sg, "title", null, who.party ? who.party.name : UNKNOWN_PARTY);
        drawFigure(sg, pos[0], pos[1], color, who.kind, who.party ? shirtChar(who.party.name) : null);
      } else {
        rect(sg, pos[0] + 1, pos[1] + 2, 8, 8, "none", {
          "class": "free", stroke: bed.tight.indexOf(slot) !== -1 ? COLORS.tight : COLORS.white, "stroke-width": 2
        });
      }
    });
    if (app.selectedBed === bed.id) rect(g, x - 3, y - 3, w + 6, h + 6, "none", { stroke: COLORS.picked, "stroke-width": 2 });
    rect(g, x - 3, y - 3, w + 6, h + 6, "none", { "class": "ring", stroke: COLORS.picked, "stroke-width": 2 });
    makeButton(g, bedLabel(st, room, bed, night) + ". Ťuknutím otvoríš.", "bed-" + bed.id, function () {
      if (app.suppressClick) { app.suppressClick = false; return; }
      onBedTap(room, bed);
    });
    watchLongPress(g, bed);
  }

  // A long press on touch shows who sleeps in the bed (a hover title does not exist there).
  function watchLongPress(g, bed) {
    var timer = null;
    var startX = 0, startY = 0;
    function cancel() {
      if (timer) { clearTimeout(timer); timer = null; }
    }
    g.addEventListener("pointerdown", function (e) {
      app.suppressClick = false;
      cancel();
      if (e.pointerType === "mouse") return;
      if (app.pinching || Date.now() - app.gestureAt < LONG_PRESS_MS) return;      // just after a pinch: not a press
      startX = e.clientX;
      startY = e.clientY;
      var gesture = app.gestureId;
      timer = setTimeout(function () {
        timer = null;
        if (app.pinching || gesture !== app.gestureId) return;      // a pinch or a drag started: not a long press
        app.suppressClick = true;
        showTip(bed);
      }, LONG_PRESS_MS);
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (name) { g.addEventListener(name, cancel); });
    // A finger always wobbles a little: only a real drag cancels the press.
    g.addEventListener("pointermove", function (e) {
      if (timer && movedBeyond(startX, startY, e.clientX, e.clientY, LONG_PRESS_SLOP)) cancel();
    });
    g.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }

  function showTip(bed) {
    var st = viewState().state, names = [];
    bed.slots.forEach(function (slot) {
      var who = slotOccupant(st, slot, app.night);
      var name = who ? (who.party ? who.party.name : UNKNOWN_PARTY) : null;
      if (name && names.indexOf(name) === -1) names.push(name);
    });
    var g = app.layers.tip;
    clearNode(g);
    if (!names.length) return;
    var text = ellipsize(names.join(", "), 28), vb = st.layout.map.viewbox, h = 18;
    var w = Math.min(vb[0] - 4, text.length * 5.4 + 14);
    var x = Math.max(2, Math.min(vb[0] - w - 2, bed.rect[0] + bed.rect[2] / 2 - w / 2));
    var y = bed.rect[1] - h - 4 < 2 ? bed.rect[1] + bed.rect[3] + 4 : bed.rect[1] - h - 4;
    board(g, [x, y, w, h], COLORS.paper, COLORS.woodDark);
    addText(g, x + w / 2, y + 12, text, 8, COLORS.ink, { anchor: "middle", bold: true, maxWidth: w - 10 });
    clearTimeout(app.tipTimer);
    app.tipTimer = setTimeout(function () { clearNode(g); }, 2500);
  }

  function renderAge() {
    if (!app.ageNode || !app.fetchedAt) return;
    setText(app.ageNode, updatedAgoText(app.fetchedAt, Date.now()), app.ageMax);
  }

  // --- panels that slide over the scene ---

  function closePanel() {
    var p = app.panel;
    if (!p) return;
    app.panel = null;
    document.removeEventListener("keydown", p.onKey, true);
    clearNode($("panelRoot"));
    if (p.onClose) p.onClose();
    // The scene is redrawn while a panel is open, so find the opener again by its key.
    var target = p.returnKey && app.layers ? byKey($("scene"), p.returnKey) : null;
    if (!target && p.returnFocus && document.contains(p.returnFocus)) target = p.returnFocus;
    if (target && target.focus) target.focus({ preventScroll: true });
  }

  // `build(body, panel)` fills the panel; it may set `panel.refresh` to redraw on new state.
  // `opts.returnKey` is the data-key of the scene element that gets focus back on close,
  // `opts.initialFocus(body)` picks the element that gets focus first (default: the first button), and
  // `opts.onClose` runs after the panel is gone.
  function openPanel(title, build, opts) {
    closePanel();
    hideToast();      // a message would sit on top of the sheet buttons
    var root = $("panelRoot");
    var backdrop = htmlEl("div", { "class": "backdrop" });
    var sheet = htmlEl("div", { "class": "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "panelTitle" });
    var head = htmlEl("div", { "class": "sheet-head" });
    head.appendChild(htmlEl("h2", { id: "panelTitle" }, title));
    var close = htmlEl("button", { "class": "close", type: "button", "aria-label": "Zavrieť" }, "✕");
    head.appendChild(close);
    var body = htmlEl("div");
    sheet.appendChild(head);
    sheet.appendChild(body);
    root.appendChild(backdrop);
    root.appendChild(sheet);

    opts = opts || {};
    var panel = {
      returnFocus: document.activeElement, returnKey: opts.returnKey || null, onClose: opts.onClose || null,
      refresh: null, onKey: null
    };
    panel.onKey = function (e) {
      // One Escape closes only the panel: it must not reach the move mode handler below.
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closePanel(); return; }
      if (e.key !== "Tab") return;
      var items = Array.prototype.filter.call(
        sheet.querySelectorAll("button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea, [tabindex='0']"),
        function (node) { return node.getClientRects().length > 0; }
      );
      if (!items.length) return;
      var first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener("keydown", panel.onKey, true);
    backdrop.addEventListener("click", closePanel);
    close.addEventListener("click", closePanel);
    app.panel = panel;
    build(body, panel);
    window.requestAnimationFrame(function () {
      sheet.classList.add("open");
      var first = (opts.initialFocus ? opts.initialFocus(body) : null) || body.querySelector("button") || close;
      first.focus({ preventScroll: true });
    });
    return panel;
  }

  // --- toast ---

  function hideToast() {
    $("toast").hidden = true;
  }

  function showToast(text, kind) {
    var node = $("toast");
    node.textContent = text;
    node.className = kind || "info";
    node.hidden = false;
    clearTimeout(app.toastTimer);
    app.toastTimer = setTimeout(hideToast, TOAST_MS);
  }

  // --- slot actions with optimistic UI ---

  // „This place is already yours“ comes back as slot_taken with params.own, and is not an error.
  function isOwnSlotTaken(e) {
    return !!(e && e.code === "slot_taken" && e.params && e.params.own === true);
  }

  // Draws the pending changes at once, sends the write, and reports a rejection in Slovak. The map
  // already shows the server's state when the promise settles (see write()). Resolves to the write result.
  function runWrite(path, body, ops) {
    app.pending = app.pending.concat(ops);
    renderBeds();
    return write("POST", path, body, ops).then(function (res) {
      if (res.ok) return res;
      if (res.status === 401) return res;     // the code screen is up; the person typed nothing wrong
      var e = res.error;
      // Tapping a place the party already holds changes nothing and is not an error.
      if (isOwnSlotTaken(e)) return res;
      showToast(errorText(e, app.state), "error");
      return res;
    });
  }

  // --- the walk from the meadow to the bed (T-017) ---

  // Starts the walk of `list` (see walkers()) in the walk layer and hides the target slots until landing.
  // Returns the walk (null when nobody walks) so that a rejected write can cancel just this one.
  function startWalk(list, party, night) {
    if (!list.length) return null;
    var walk = { start: performance.now(), items: [] };
    var ch = shirtChar(party.name);
    list.forEach(function (w) {
      var key = night + "|" + w.slot;
      var node = svgEl(app.layers.walk, "g", { transform: "translate(" + w.from[0] + " " + w.from[1] + ")" });
      drawFigure(node, 0, 0, w.color, w.kind, ch);      // opaque all the way, even while the write is unconfirmed
      app.walking[key] = true;
      walk.items.push({ key: key, node: node, from: w.from, to: w.to });
    });
    app.walks.push(walk);
    if (!app.walkFrame) app.walkFrame = requestAnimationFrame(stepWalks);
    return walk;
  }

  // One animation frame for all walks: move every figure along its line, land the walks that are done.
  function stepWalks(now) {
    app.walkFrame = 0;
    var landed = false;
    app.walks = app.walks.filter(function (walk) {
      var elapsed = now - walk.start;
      if (elapsed >= WALK_MS) {
        dropWalk(walk);
        landed = true;
        return false;
      }
      var t = walkProgress(elapsed, WALK_MS);
      walk.items.forEach(function (item) {
        var p = walkPosition(item.from, item.to, t);
        item.node.setAttribute("transform", "translate(" + p[0] + " " + p[1] + ")");
      });
      return true;
    });
    // The figure now stands in the bed: opaque if the server has confirmed meanwhile, else semi-transparent.
    if (landed) renderBeds();
    if (app.walks.length) app.walkFrame = requestAnimationFrame(stepWalks);
  }

  // Removes the walkers of one walk and shows their slots again (the caller redraws the beds).
  function dropWalk(walk) {
    walk.items.forEach(function (item) {
      if (item.node.parentNode) item.node.parentNode.removeChild(item.node);
      delete app.walking[item.key];
    });
  }

  function stopWalkLoop() {
    if (!app.walks.length && app.walkFrame) {
      cancelAnimationFrame(app.walkFrame);
      app.walkFrame = 0;
    }
  }

  // Cancels one walk, or all walks without an argument. Does not redraw: the caller does, or a render follows.
  function cancelWalks(only) {
    app.walks = app.walks.filter(function (walk) {
      if (only && walk !== only) return true;
      dropWalk(walk);
      return false;
    });
    stopWalkLoop();
  }

  // A walker whose bed place is released or moved away while it is still on its way would land in an empty
  // bed, so it goes away at once (the redraw that follows shows the place as it now is).
  function cancelWalkersAt(night, slot) {
    var key = night + "|" + slot;
    app.walks.forEach(function (walk) {
      walk.items = walk.items.filter(function (item) {
        if (item.key !== key) return true;
        dropWalk({ items: [item] });
        return false;
      });
    });
    app.walks = app.walks.filter(function (walk) { return walk.items.length; });
    stopWalkLoop();
  }

  function myParty(st) {
    return partyById(st, app.myParty);
  }

  function assignHere(bed, stay) {
    var st = viewState().state, party = myParty(st), night = app.night;
    if (!party) { closePanel(); openWho(); return; }
    if (!isPresent(party, night)) return;
    var slots = slotsToTake(st, party, bed, night);
    if (!slots.length) return;
    var ops = [], nights = stay ? stayNights(st, party, slots) : [night];
    nights.forEach(function (n) {
      slots.forEach(function (slot) { ops.push({ night: n, slot: slot, party_id: party.id }); });
    });
    var walk = null;
    if (!prefersReducedMotion()) {
      var after = withPending(app.state, app.pending.concat(ops)).state;
      walk = startWalk(walkers(st, after, party, bed, slots, night, st.layout.map.scene.meadow), party, night);
    }
    closePanel();
    var run = stay
      ? runWrite("api/assign-stay", { slots: slots, party_id: party.id }, ops)
      : runWrite("api/assign", { night: night, slots: slots, party_id: party.id }, ops);
    run.then(function (res) {
      // A rejected write puts the figure back on the meadow by the normal rollback (a 401 already cancelled).
      if (walk && !res.ok && !isOwnSlotTaken(res.error)) {
        cancelWalks(walk);
        renderBeds();
      }
      var skipped = res.ok && res.json && res.json.skipped;
      if (skipped && skipped.length) showToast(skippedText(skipped), "info");
    });
  }

  function clearSlot(slot) {
    var night = app.night;
    closePanel();
    cancelWalkersAt(night, slot);
    runWrite("api/clear", { night: night, slot: slot }, [{ night: night, slot: slot, party_id: null }]);
  }

  // --- move mode ---

  function renderMoveBar() {
    var bar = $("moveBar"), m = app.move;
    bar.hidden = !m;
    if (m && app.state) {
      var party = myParty(app.state);
      $("moveText").textContent = moveBarText(party ? party.name : "");
      $("moveThis").setAttribute("aria-pressed", m.all ? "false" : "true");
      $("moveAll").setAttribute("aria-pressed", m.all ? "true" : "false");
    }
    if (app.refit) app.refit();      // the scene makes room for the bar (or takes it back)
  }

  function startMove(slot) {
    app.move = { partyId: app.myParty, fromSlot: slot, all: false };
    closePanel();
    renderMoveBar();
    $("moveThis").focus({ preventScroll: true });
  }

  function cancelMove() {
    app.move = null;
    renderMoveBar();
  }

  function moveTo(bed) {
    var m = app.move, st = viewState().state;
    var plan = planMove(st, m, bed, app.night);
    if (plan.error) {
      showToast(plan.error, "error");
      return;
    }
    var ops = [];
    plan.nights.forEach(function (n) {
      ops.push({ night: n, slot: m.fromSlot, party_id: null });
      ops.push({ night: n, slot: plan.target, party_id: m.partyId });
    });
    app.move = null;
    renderMoveBar();
    plan.nights.forEach(function (n) { cancelWalkersAt(n, m.fromSlot); });
    runWrite("api/move", { party_id: m.partyId, from_slot: m.fromSlot, to_slot: plan.target, nights: plan.nights }, ops);
  }

  function onBedTap(room, bed) {
    collapseNotice();
    if (app.move) moveTo(bed);
    else openBedSheet(room, bed);
  }

  // --- the bed sheet ---

  function openBedSheet(room, bed) {
    openPanel(bed.name, function (body, panel) {
      var confirm = null;     // {slot, partyId, night} while „Naozaj ho uvoľniť?“ is asked

      function button(text, key, onClick, secondary, label) {
        var b = htmlEl("button", { "class": "btn" + (secondary ? " secondary" : ""), type: "button", "data-key": key }, text);
        if (label) b.setAttribute("aria-label", label);
        b.addEventListener("click", onClick);
        return b;
      }

      function focusKey(key) {
        var node = byKey(body, key);
        if (node) node.focus({ preventScroll: true });
      }

      function slotRow(st, slot, i, night) {
        var who = slotOccupant(st, slot, night), name = who ? (who.party ? who.party.name : UNKNOWN_PARTY) : "voľné";
        var rowText = (bed.slots.length > 1 ? "Miesto " + (i + 1) + ": " : "") + name;
        var row = htmlEl("div", { "class": "slot-row" });
        var label = htmlEl("span", { "class": "who" });
        var swatch = htmlEl("span", { "class": "swatch" + (who ? "" : " free"), "aria-hidden": "true" });
        if (who && who.party) swatch.style.background = who.party.color;
        label.appendChild(swatch);
        label.appendChild(htmlEl("span", null, rowText));
        if (!who && bed.tight.indexOf(slot) !== -1) label.appendChild(htmlEl("span", { "class": "tight" }, "(tesné)"));
        row.appendChild(label);
        if (who && night === app.night) slotActions(row, st, slot, who, rowText);
        return row;
      }

      function slotActions(row, st, slot, who, rowText) {
        var pid = who.party ? who.party.id : null, mine = pid !== null && pid === app.myParty;
        var name = who.party ? who.party.name : UNKNOWN_PARTY;
        if (confirm && confirm.slot === slot && confirm.partyId === pid && confirm.night === app.night) {
          row.appendChild(htmlEl("p", { "class": "confirm" }, releaseConfirmText(name)));
          row.appendChild(button("Uvoľniť", "yes-" + slot, function () { clearSlot(slot); }, false, "Naozaj uvoľniť: " + rowText));
          row.appendChild(button("Nie", "no-" + slot, function () { confirm = null; panel.refresh(); focusKey("clear-" + slot); }, true));
          return;
        }
        row.appendChild(button("Uvoľniť", "clear-" + slot, function () {
          if (mine) clearSlot(slot);
          else { confirm = { slot: slot, partyId: pid, night: app.night }; panel.refresh(); focusKey("no-" + slot); }
        }, true, "Uvoľniť " + rowText));
        if (mine) row.appendChild(button("Presunúť", "move-" + slot, function () { startMove(slot); }, true, "Presunúť " + rowText));
      }

      function nightSection(st, night) {
        var info = nightInfo(night) || { label: night, dates: "" };
        var sec = htmlEl("section", { "class": "night" + (night === app.night ? " on" : "") });
        var head = htmlEl("button", {
          "class": "night-head", type: "button", "data-key": "night-" + night, "aria-pressed": night === app.night ? "true" : "false"
        }, info.label + " · " + info.dates);
        head.addEventListener("click", function () { selectNight(night); });
        sec.appendChild(head);
        bed.slots.forEach(function (slot, i) { sec.appendChild(slotRow(st, slot, i, night)); });
        return sec;
      }

      function addActions(st) {
        var night = app.night, party = myParty(st), box = htmlEl("div", { "class": "actions" });
        var present = party ? isPresent(party, night) : true;
        var take = party && present ? slotsToTake(st, party, bed, night) : [];
        var blocked = !!party && take.length === 0;
        var assign = button(assignLabel(take.length), "assign", function () { assignHere(bed, false); });
        var stay = button("Na všetky naše noci", "stay", function () { assignHere(bed, true); }, true);
        assign.disabled = blocked;
        stay.disabled = blocked;
        box.appendChild(assign);
        box.appendChild(stay);
        if (party && !present) {
          box.appendChild(htmlEl("p", { "class": "note" }, notPresentText(night)));
          box.appendChild(button("Upraviť príchod a odchod", "edit-party", function () {
            closePanel();
            openPartyForm(party, { returnKey: "bed-" + bed.id });
          }, true));
        } else if (blocked) {
          box.appendChild(htmlEl("p", { "class": "note" }, "Táto posteľ je v túto noc plná."));
        }
        body.appendChild(box);
      }

      function fill() {
        clearNode(body);
        var st = viewState().state;
        if (confirm) {      // drop the question when the place changed hands or the night changed
          var who = slotOccupant(st, confirm.slot, app.night), pid = who && who.party ? who.party.id : null;
          if (confirm.night !== app.night || pid !== confirm.partyId) confirm = null;
        }
        body.appendChild(htmlEl("p", { "class": "sub" }, room.name));
        st.event.nights.forEach(function (night) { body.appendChild(nightSection(st, night)); });
        addActions(st);
      }

      panel.refresh = function () {
        keepFocus(body, fill, function () { return body.querySelector("button:not([disabled])"); });
      };
      app.selectedBed = bed.id;
      renderBeds();
      fill();
    }, {
      returnKey: "bed-" + bed.id,
      onClose: function () {
        if (app.selectedBed !== bed.id) return;
        app.selectedBed = null;
        if (app.state) renderBeds();
      }
    });
  }

  function openWho() {
    openPanel("Kto si?", function (body, panel) {
      body.appendChild(htmlEl("p", null, "Vyber partiu, za ktorú sa zapisuješ."));
      var list = htmlEl("ul", { "class": "party-list" });
      body.appendChild(list);
      var actions = htmlEl("div", { "class": "actions" });
      body.appendChild(actions);
      var add = htmlEl("button", { "class": "btn", type: "button", "data-key": "add-party" }, "Pridať partiu");
      add.addEventListener("click", function () {
        closePanel();
        openPartyForm(null, { returnKey: "who" });
      });
      var edit = htmlEl("button", { "class": "btn secondary", type: "button", "data-key": "edit-party" });
      edit.addEventListener("click", function () {
        var mine = app.state ? partyById(app.state, app.myParty) : null;
        if (!mine) return;
        closePanel();
        openPartyForm(mine, { returnKey: "who" });
      });
      actions.appendChild(add);
      actions.appendChild(edit);
      panel.refresh = function () {
        // A new state rebuilds the rows, so focus returns to the same party (or to the first button).
        keepFocus(body, function () {
          fillParties(list);
          var mine = app.state ? partyById(app.state, app.myParty) : null;
          edit.hidden = !mine;
          if (mine) edit.textContent = "Upraviť partiu „" + mine.name + "“";
        }, function () { return add; });
      };
      function fillParties(list) {
        clearNode(list);
        var parties = app.state ? app.state.parties : [];
        if (!parties.length) {
          list.appendChild(htmlEl("li", { "class": "muted" }, "Zatiaľ tu nikto nie je. Pridaj prvú partiu."));
        }
        parties.forEach(function (party) {
          var li = htmlEl("li");
          var row = htmlEl("button", {
            "class": "party-row", type: "button", "data-key": "party-" + party.id, "aria-current": party.id === app.myParty ? "true" : "false"
          });
          var swatch = htmlEl("span", { "class": "swatch", "aria-hidden": "true" });
          swatch.style.background = party.color;
          row.appendChild(swatch);
          row.appendChild(htmlEl("span", { "class": "name" }, party.name));
          if (party.id === app.myParty) row.appendChild(htmlEl("span", { "class": "mark", "aria-hidden": "true" }, "✓"));
          row.addEventListener("click", function () {
            setMyParty(party.id);
            closePanel();
            render();
          });
          li.appendChild(row);
          list.appendChild(li);
        });
      }
      panel.refresh();
    }, { returnKey: "who" });
  }

  // The shirt letter at 2 CSS px per pixel, for the legend swatch: the same mark as on the map.
  function glyphIcon(ch, ink) {
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 3 5");
    svg.setAttribute("width", "6");
    svg.setAttribute("height", "10");
    svg.setAttribute("shape-rendering", "crispEdges");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    var path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", glyphPath(ch, 0, 0));
    path.setAttribute("fill", ink);
    svg.appendChild(path);
    return svg;
  }

  // „Kto je kto“: a read-only list of the parties with the colour of their figures.
  function openLegend(returnKey) {
    openPanel("Kto je kto", function (body, panel) {
      body.appendChild(htmlEl("p", null, "Farba postavičky na mape patrí partii."));
      var list = htmlEl("ul", { "class": "legend-list" });
      body.appendChild(list);
      body.appendChild(htmlEl("p", null, "Menšia postavička je dieťa. Žltý rámik majú miesta tvojej partie."));
      var actions = htmlEl("div", { "class": "actions" });
      var choose = htmlEl("button", { "class": "btn secondary", type: "button", "data-key": "choose-party" }, "Vybrať moju partiu");
      choose.addEventListener("click", function () {
        closePanel();
        openWho();
      });
      actions.appendChild(choose);
      body.appendChild(actions);
      panel.refresh = function () {
        clearNode(list);
        var rows = app.state ? legendRows(app.state, app.myParty) : [];
        var tableRows = app.state ? partyTableRows(app.state, app.myParty) : [];
        if (!rows.length) list.appendChild(htmlEl("li", { "class": "legend-empty" }, "Zatiaľ tu nikto nie je."));
        rows.forEach(function (row, i) {
          var li = htmlEl("li", { "class": "legend-row" });
          var swatch = htmlEl("span", { "class": "swatch", "aria-hidden": "true" });
          swatch.style.background = row.color;
          swatch.appendChild(glyphIcon(row.ch, row.ink));
          var text = htmlEl("div", { "class": "legend-text" });
          var name = htmlEl("div", { "class": "legend-name" }, row.name);
          if (row.mine) name.appendChild(htmlEl("span", { "class": "legend-me" }, " (ty)"));
          text.appendChild(name);
          text.appendChild(htmlEl("div", { "class": "legend-meta" }, row.people + " · " + row.stay));
          text.appendChild(nightsLine(tableRows[i]));
          li.appendChild(swatch);
          li.appendChild(text);
          list.appendChild(li);
        });
      };
      panel.refresh();
    }, { returnKey: returnKey || "legend" });
  }

  // The per-night places of one party as a line of parts that do not break inside: "Št → Pi 2/3".
  function nightsLine(row) {
    var line = htmlEl("div", { "class": "legend-nights" });
    legendNightParts(row).forEach(function (part, i) {
      if (i) line.appendChild(document.createTextNode(" · "));
      line.appendChild(htmlEl("span", null, part));
    });
    return line;
  }

  // --- party form ---

  var FORM_LABELS = {
    name: "Meno partie", adults: "Dospelí", kids: "Deti", kids_in_parents_bed: "Deti spiace s rodičmi",
    arrive: "Príchod", leave: "Odchod", arrival_time: "Čas príchodu", note: "Poznámka"
  };

  // The party form for a new party (`party` is null) or to edit one. `opts.returnKey` is the scene element
  // that gets focus back on close.
  function openPartyForm(party, opts) {
    var event = app.state.event, editing = !!party;
    var fields = {}, errors = {};
    openPanel(editing ? "Upraviť partiu" : "Nová partia", function (body, panel) {
      var values = editing ? partyToForm(party) : defaultPartyForm(event);
      var form = htmlEl("form", { "class": "pform", novalidate: "" });
      var formError = htmlEl("p", { "class": "form-error", role: "alert", hidden: "" });

      // One labelled field: `input` is the control, and a paragraph under it carries that field's error.
      function field(name, input, opts2) {
        var wrap = htmlEl("div", { "class": "field" });
        var label = htmlEl("label", { "for": "pf-" + name }, FORM_LABELS[name]);
        if (opts2 && opts2.optional) label.appendChild(htmlEl("span", { "class": "opt" }, " (nepovinné)"));
        input.id = "pf-" + name;
        input.name = name;
        var err = htmlEl("p", { "class": "field-error", id: "pf-" + name + "-err", hidden: "" });
        input.setAttribute("aria-describedby", "pf-" + name + "-err" + (opts2 && opts2.hint ? " pf-" + name + "-hint" : ""));
        wrap.appendChild(label);
        wrap.appendChild(input);
        if (opts2 && opts2.hint) wrap.appendChild(htmlEl("p", { "class": "hint", id: "pf-" + name + "-hint" }, opts2.hint));
        wrap.appendChild(err);
        fields[name] = input;
        errors[name] = err;
        return wrap;
      }

      function textInput(name, max) {
        var i = htmlEl("input", { type: "text", maxlength: String(max), autocomplete: "off" });
        i.value = values[name];
        return i;
      }

      function countInput(name) {
        var i = htmlEl("input", {
          type: "number", min: "0", max: String(PARTY_LIMITS.countMax), step: "1", inputmode: "numeric"
        });
        i.value = String(values[name]);
        return i;
      }

      function daySelect(name, days) {
        var sel = htmlEl("select");
        days.forEach(function (day) {
          var o = htmlEl("option", { value: day }, dayOptionText(day));
          if (day === values[name]) o.selected = true;
          sel.appendChild(o);
        });
        return sel;
      }

      var note = htmlEl("textarea", { maxlength: String(PARTY_LIMITS.note), rows: "3" });
      note.value = values.note;

      form.appendChild(formError);
      form.appendChild(field("name", textInput("name", PARTY_LIMITS.name)));
      var pair = htmlEl("div", { "class": "pair" });
      pair.appendChild(field("adults", countInput("adults")));
      pair.appendChild(field("kids", countInput("kids")));
      form.appendChild(pair);
      form.appendChild(field("kids_in_parents_bed", countInput("kids_in_parents_bed"), {
        hint: "Takéto dieťa nepotrebuje vlastné miesto."
      }));
      var days = htmlEl("div", { "class": "pair" });
      days.appendChild(field("arrive", daySelect("arrive", event.arrive_days)));
      days.appendChild(field("leave", daySelect("leave", event.leave_days)));
      form.appendChild(days);
      form.appendChild(field("arrival_time", textInput("arrival_time", PARTY_LIMITS.arrival_time), { optional: true }));
      form.appendChild(field("note", note, { optional: true }));

      var confirmBox = htmlEl("div", { "class": "note", hidden: "", role: "alert" });
      form.appendChild(confirmBox);
      var row = htmlEl("div", { "class": "row" });
      var save = htmlEl("button", { "class": "btn", type: "submit", "data-key": "save" }, "Uložiť");
      var cancel = htmlEl("button", { "class": "btn secondary", type: "button" }, "Zrušiť");
      cancel.addEventListener("click", closePanel);
      row.appendChild(save);
      row.appendChild(cancel);
      form.appendChild(row);
      body.appendChild(form);

      function readPayload() {
        var raw = {};
        FORM_FIELDS.forEach(function (name) {
          var input = fields[name];
          // A number field with unreadable text reports an empty value: keep it as an error, not a 0.
          raw[name] = input.validity && input.validity.badInput ? "?" : input.value;
        });
        return partyPayload(raw);
      }

      function clearErrors() {
        FORM_FIELDS.forEach(function (name) {
          errors[name].hidden = true;
          errors[name].textContent = "";
          fields[name].removeAttribute("aria-invalid");
        });
        formError.hidden = true;
        formError.textContent = "";
      }

      // The Slovak text of an error goes next to the field it is about, else on top of the form.
      function showError(error) {
        clearErrors();
        var name = errorField(error), text = errorText(error, app.state);
        if (name) {
          errors[name].textContent = text;
          errors[name].hidden = false;
          fields[name].setAttribute("aria-invalid", "true");
          fields[name].focus();
        } else {
          formError.textContent = text;
          formError.hidden = false;
          formError.scrollIntoView({ block: "nearest" });
        }
      }

      function hideConfirm() {
        confirmBox.hidden = true;
        clearNode(confirmBox);
        save.textContent = "Uložiť";
        save.removeAttribute("data-confirm");
      }

      // Shortening a stay frees places: name them and ask once.
      function askToFree(freed) {
        clearNode(confirmBox);
        confirmBox.appendChild(htmlEl("p", null, FREED_TEXTS.ask));
        var list = htmlEl("ul", { "class": "freed" });
        freedLines(app.state, freed).forEach(function (line) { list.appendChild(htmlEl("li", null, line)); });
        confirmBox.appendChild(list);
        confirmBox.hidden = false;
        save.textContent = "Uložiť a uvoľniť miesta";
        save.setAttribute("data-confirm", "1");
        save.focus();
      }

      function showDone(freed) {
        clearNode(body);
        body.appendChild(htmlEl("p", null, FREED_TEXTS.done));
        var list = htmlEl("ul", { "class": "done-list" });
        freedLines(app.state, freed).forEach(function (line) { list.appendChild(htmlEl("li", null, line)); });
        body.appendChild(list);
        var ok = htmlEl("button", { "class": "btn", type: "button" }, "Zavrieť");
        ok.addEventListener("click", closePanel);
        body.appendChild(ok);
        ok.focus();
      }

      function send(payload) {
        save.disabled = true;
        save.textContent = "Ukladám…";
        var req = editing ? write("PUT", "api/parties/" + encodeURIComponent(party.id), payload) : write("POST", "api/parties", payload);
        req.then(function (res) {
          if (res.ok) {
            var created = res.json && res.json.party;
            if (!editing && created) {
              setMyParty(created.id);
              render();
            }
            var freed = (res.json && res.json.freed) || [];
            if (app.panel !== panel) return;
            if (freed.length) { showDone(freed); return; }
            closePanel();
            showToast(editing ? "Zmeny sú uložené." : "Partia „" + payload.name + "“ je pridaná.", "info");
            return;
          }
          if (app.panel !== panel || res.status === 401) return;
          save.disabled = false;
          hideConfirm();
          showError(res.error || { code: "" });
        });
      }

      form.addEventListener("input", function () {
        if (!confirmBox.hidden) hideConfirm();
      });
      form.addEventListener("change", function () {
        if (!confirmBox.hidden) hideConfirm();
      });
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (save.disabled) return;
        clearErrors();
        var payload = readPayload();
        var problem = checkPartyPayload(payload, event);
        if (problem) { hideConfirm(); showError(problem); return; }
        if (editing && !save.getAttribute("data-confirm")) {
          var freed = freedByStay(app.state, party.id, payload.arrive, payload.leave);
          if (freed.length) { askToFree(freed); return; }
        }
        send(payload);
      });
    }, {
      returnKey: opts && opts.returnKey,
      initialFocus: function (body) { return body.querySelector("input"); }
    });
  }

  // --- „Prehľad na poslanie“ ---

  function pageLink() {
    return window.location.origin + window.location.pathname;
  }

  function openSummary() {
    openPanel("Prehľad na poslanie", function (body, panel) {
      body.appendChild(htmlEl("p", null, "Skopíruj text a pošli ho do skupiny."));
      var area = htmlEl("textarea", { "class": "summary-text", readonly: "", rows: "14", "aria-label": "Text na poslanie" });
      var status = htmlEl("p", { "class": "copy-status", role: "status" });
      var copy = htmlEl("button", { "class": "btn", type: "button", "data-key": "copy" }, "Kopírovať");
      body.appendChild(area);
      body.appendChild(copy);
      body.appendChild(status);

      // The text follows the state while the panel is open (a poll may change it).
      panel.refresh = function () {
        var text = app.state ? summaryText(viewState().state, pageLink()) : "";
        if (area.value !== text) area.value = text;
      };

      function selectText() {
        area.focus({ preventScroll: true });
        area.select();
        area.setSelectionRange(0, area.value.length);
      }

      function fallback() {
        selectText();
        var copied = false;
        try { copied = document.execCommand("copy"); } catch (e) { copied = false; }
        status.textContent = copied ? "Skopírované." : "Text je označený, skopíruj ho.";
      }

      copy.addEventListener("click", function () {
        var text = area.value;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            status.textContent = "Skopírované.";
          }, fallback);
        } else {
          fallback();
        }
      });
      panel.refresh();
    }, { returnKey: "letter" });
  }

  // --- code screen ---

  function showCodeScreen() {
    if (app.codeOpen) return;
    app.codeOpen = true;
    cancelWalks();
    closePanel();
    hideToast();
    app.move = null;
    renderMoveBar();
    if (app.introTimer !== null) {
      clearTimeout(app.introTimer);
      app.introTimer = null;
    }
    hideBoot();
    showScene(false);
    $("codeScreen").hidden = false;
    $("codeInput").focus();
  }

  function hideCodeScreen() {
    app.codeOpen = false;
    $("codeScreen").hidden = true;
    $("codeError").textContent = "";
  }

  $("codeForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = $("codeInput"), button = $("codeButton"), errorNode = $("codeError");
    var code = input.value.trim();
    if (!code) {
      errorNode.textContent = "Najprv napíš kód.";
      input.focus();
      return;
    }
    button.disabled = true;
    errorNode.textContent = "";
    request("POST", "api/join", { code: code }).then(function (r) {
      if (r.status === 200 && r.json && r.json.ok) {
        if (r.json.role) {
          app.role = r.json.role;
          storage.set(KEYS.role, r.json.role);
        }
        input.value = "";
        app.askWho = !app.myParty;
        app.etag = null;
        hideCodeScreen();
        // Before the first reveal (no state yet, or one that was only stored) the splash shows again
        // and the intro clock restarts, so the intro plays once, after the code.
        if (!app.introDone) {
          app.introStart = performance.now();
          showBoot();
        }
        showScene(app.introDone);
        poll();
      } else {
        errorNode.textContent = errorText(r.json ? r.json.error : undefined, null);
        input.focus();
      }
    }, function () {
      errorNode.textContent = errorText(undefined, null);
    }).then(function () {
      button.disabled = false;
    });
  });

  // --- start ---

  $("moveThis").addEventListener("click", function () { if (app.move) { app.move.all = false; renderMoveBar(); } });
  $("moveAll").addEventListener("click", function () { if (app.move) { app.move.all = true; renderMoveBar(); } });
  $("moveCancel").addEventListener("click", cancelMove);
  $("toast").addEventListener("click", hideToast);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && app.move && !app.panel) cancelMove();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" && e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") app.navKeyAt = Date.now();
  }, true);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") poll();
  });
  setInterval(function () {
    if (document.visibilityState === "visible") poll();
  }, POLL_MS);
  setInterval(renderAge, AGE_TICK_MS);
  poll();           // the first request leaves before anything is drawn
  drawSplash();
})();
</script>
</body>
</html>
