// Slovak text for a server error `{code, message, params}`. The English `message` is never used.
// A missing error (network failure) and an unknown code both give the generic text.
function errorText(error, state) {
  if (!error || typeof error !== "object" || typeof error.code !== "string") return FALLBACK_ERROR;
  if (!ERROR_TEXTS.hasOwnProperty(error.code)) return FALLBACK_ERROR;
  var params = error.params && typeof error.params === "object" ? error.params : {};
  return ERROR_TEXTS[error.code](params, state || null) || FALLBACK_ERROR;
}

// --- loading intro: a full-screen pixel picture that stands still, then falls apart downwards ---

var BOOT_MIN_MS = 1500;          // still splash before the fall may start, from page start
var BOOT_MIN_REDUCED_MS = 800;   // still splash with prefers-reduced-motion, then hidden at once
var BOOT_FALL_MS = 1500;         // the whole fall: the last block is below the screen by then
var SPLASH_STEP_MS = 80;         // one held step of the fall
var SPLASH_BLOCK_FALL_MS = 600;  // one block, from its place to below the screen; also the CSS sign drop (#bootText)
var SPLASH_MAX_BLOCKS = 1500, SPLASH_MIN_BLOCK = 10, SPLASH_MAX_BLOCK = 40;

// BOOT_MIN_REDUCED_MS when reducedMotion is true, else BOOT_MIN_MS.
function bootMinMs(reducedMotion) {
  return reducedMotion ? BOOT_MIN_REDUCED_MS : BOOT_MIN_MS;
}

// How long the fall lasts: nothing with reduced motion, else BOOT_FALL_MS.
function bootFallMs(reducedMotion) {
  return reducedMotion ? 0 : BOOT_FALL_MS;
}

// How many ms the loading view must still stay: max(0, minMs - (nowMs - startMs)), never more than minMs.
// Any non-finite argument returns 0, so a broken clock never holds the map back.
function bootRemaining(startMs, nowMs, minMs) {
  if (typeof startMs !== "number" || typeof nowMs !== "number" || typeof minMs !== "number") return 0;
  if (!isFinite(startMs) || !isFinite(nowMs) || !isFinite(minMs)) return 0;
  return Math.min(minMs, Math.max(0, minMs - (nowMs - startMs)));
}

// The block grid that covers a vw x vh viewport (CSS px): {size, cols, rows}. The count is capped, not the size,
// so a phone gets about 1400 blocks of 13 to 15 px and a desktop about as many bigger ones.
function splashGrid(vw, vh) {
  if (typeof vw !== "number" || typeof vh !== "number" || !isFinite(vw) || !isFinite(vh) || vw <= 0 || vh <= 0) {
    return { size: SPLASH_MIN_BLOCK, cols: 0, rows: 0 };
  }
  var size = Math.ceil(Math.sqrt(vw * vh / SPLASH_MAX_BLOCKS));
  size = Math.min(SPLASH_MAX_BLOCK, Math.max(SPLASH_MIN_BLOCK, size));
  return { size: size, cols: Math.ceil(vw / size), rows: Math.ceil(vh / size) };
}

// The keys of COLORS (in the app script) that the splash picture may use: fixed scene colors only.
var SPLASH_COLOR_KEYS = [
  "window", "white", "wood", "woodLight", "plank", "woodDark", "leafRed", "redEdge", "stoveDark", "stovePipe",
  "selected", "path", "grass", "tuft", "leafRust", "leafOchre"
];

// The cabin seen from the front, one character per block (18 x 14). "." is transparent.
var SPLASH_SPRITE = [
  "..............cc..",
  "........EEEE..CC..",
  "......EERRRREECC..",
  "....EERRRRRRRREE..",
  "..EERRRRRRRRRRRREE",
  "DDDDDDDDDDDDDDDDDD",
  ".WWWWWWWWWWWWWWWW.",
  ".WDDDDWDDDDWDDDDW.",
  ".WDSSDWDPPDWDSSDW.",
  ".WDSSDWDPLDWDSSDW.",
  ".WDDDDWDPPDWDDDDW.",
  ".PPPPPPDPPDPPPPPP.",
  ".WWWWWWDPPDWWWWWW.",
  ".DDDDDDDPPDDDDDDD."
];
var SPLASH_SPRITE_KEYS = {
  R: "leafRed", E: "redEdge", D: "woodDark", W: "wood", L: "woodLight", P: "plank",
  S: "selected", C: "stoveDark", c: "stovePipe"
};
// An autumn tree crown (8 x 5) of leafOchre (O), leafRust (U) and leafRed (R); the trunk is woodDark.
var SPLASH_CROWN = [
  "..OOOO..",
  ".OUUOUO.",
  "OUURUUUO",
  ".UUUURU.",
  "..UUUU.."
];
var SPLASH_CROWN_KEYS = { O: "leafOchre", U: "leafRust", R: "leafRed" };

// A small deterministic hash of (col, row): the same on every reload, so the picture and the tests are stable.
function splashHash(col, row) {
  var h = (Math.imul(col + 1, 374761393) + Math.imul(row + 1, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}

// The picture as `rows` arrays of `cols` COLORS keys: sky with clouds, hills, grass with tufts and fallen leaves,
// a path to the door, autumn trees when there is room, and the cabin sprite centered on the horizon.
// 0 x 0 (or any non-positive size) gives [].
function splashPicture(cols, rows) {
  if (typeof cols !== "number" || typeof rows !== "number" || !(cols >= 1) || !(rows >= 1)) return [];
  cols = Math.floor(cols);
  rows = Math.floor(rows);
  var spriteH = SPLASH_SPRITE.length, spriteW = SPLASH_SPRITE[0].length;
  var top = Math.floor(rows * 0.6) - (spriteH - 1);   // first row of the sprite; its base sits a bit below the middle
  var horizon = top + 10;                              // the first grass row
  var left = Math.floor((cols - spriteW) / 2);         // negative on a very narrow grid: the sprite is clipped
  var pic = [], r, c;

  for (r = 0; r < rows; r++) {
    var line = [];
    for (c = 0; c < cols; c++) line.push(r < horizon ? "window" : "grass");
    pic.push(line);
  }
  function put(c, r, key) {
    if (c >= 0 && c < cols && r >= 0 && r < rows) pic[r][c] = key;
  }
  function cloud(c0, r0, w) {
    for (var i = 1; i < w - 1; i++) put(c0 + i, r0, "white");
    for (var j = 0; j < w; j++) put(c0 + j, r0 + 1, "white");
  }

  // far hills at the horizon, ragged
  for (c = 0; c < cols; c++) {
    if (splashHash(c, horizon - 1) % 4 !== 0) put(c, horizon - 1, "tuft");
    if (splashHash(c, horizon - 2) % 5 === 0) put(c, horizon - 2, "tuft");
  }
  if (horizon >= 6) {
    cloud(Math.floor(cols * 0.1), Math.floor(horizon * 0.12), 6);
    cloud(Math.floor(cols * 0.7), Math.floor(horizon * 0.3), 5);
  }

  // trees on both sides, only when the grid is wide enough
  if (left >= 8) {
    var treeBase = [top + spriteH, top + spriteH - 2];
    var treeX = [Math.floor(left / 2), Math.floor((left + spriteW + cols) / 2)];
    for (var t = 0; t < 2; t++) {
      var tx = treeX[t], tb = treeBase[t];
      for (r = 0; r < 3; r++) { put(tx - 1, tb - r, "woodDark"); put(tx, tb - r, "woodDark"); }
      for (r = 0; r < SPLASH_CROWN.length; r++) {
        for (c = 0; c < SPLASH_CROWN[r].length; c++) {
          var ck = SPLASH_CROWN_KEYS[SPLASH_CROWN[r][c]];
          if (ck) put(tx - 4 + c, tb - 3 - (SPLASH_CROWN.length - 1 - r), ck);
        }
      }
    }
  }

  // the path from the door down, widening a little with distance
  var doorCol = left + 8;
  for (r = top + spriteH; r < rows; r++) {
    var extra = Math.floor((r - (top + spriteH - 1)) / 6);
    for (c = doorCol - extra; c <= doorCol + 1 + extra; c++) {
      var edge = extra > 0 && (c === doorCol - extra || c === doorCol + 1 + extra);
      if (!(edge && splashHash(c, r) % 4 === 0)) put(c, r, "path");
    }
  }

  // the cabin
  for (r = 0; r < spriteH; r++) {
    for (c = 0; c < spriteW; c++) {
      var key = SPLASH_SPRITE_KEYS[SPLASH_SPRITE[r][c]];
      if (key) put(left + c, top + r, key);
    }
  }

  // tufts and fallen leaves on the plain grass
  for (r = 0; r < rows; r++) {
    for (c = 0; c < cols; c++) {
      if (pic[r][c] !== "grass") continue;
      var h = splashHash(c, r) % 40;
      if (h < 4) pic[r][c] = "tuft";
      else if (h === 4) pic[r][c] = "leafRust";
      else if (h === 5) pic[r][c] = "leafOchre";
      else if (h === 6) pic[r][c] = "leafRed";
    }
  }
  return pic;
}

// When a block starts to fall, in ms after the start of the fall: the bottom rows go first with a ragged
// edge. A multiple of SPLASH_STEP_MS in [0, BOOT_FALL_MS - SPLASH_BLOCK_FALL_MS].
function splashDelay(col, row, cols, rows) {
  var span = BOOT_FALL_MS - SPLASH_BLOCK_FALL_MS;
  var order = rows > 1 ? (rows - 1 - row) / (rows - 1) : 0;   // 0 at the bottom row, 1 at the top row
  var jitter = splashHash(col, row) % 1000 / 1000;            // 0 to just under 1
  var ms = order * span * 0.65 + jitter * span * 0.35;
  var steps = Math.floor(ms / SPLASH_STEP_MS);
  return Math.min(steps, Math.floor(span / SPLASH_STEP_MS)) * SPLASH_STEP_MS;
}

var SPLASH_SWAY = [0, 1, 0, -1];   // sideways sway per step, times about a third of the block size

// Offset {dx, dy} (whole CSS px) of a block elapsedMs after the fall started, for a block that starts at delayMs.
// Held within each SPLASH_STEP_MS step; accelerates downwards and has moved fallPx by delayMs + SPLASH_BLOCK_FALL_MS;
// |dx| is at most size / 2.
function splashFall(elapsedMs, delayMs, fallPx, size) {
  var t = elapsedMs - delayMs;
  if (!(t >= 0)) return { dx: 0, dy: 0 };
  var step = Math.floor(t / SPLASH_STEP_MS);
  var steps = Math.ceil(SPLASH_BLOCK_FALL_MS / SPLASH_STEP_MS);
  var p = Math.min(1, (step + 1) / steps);
  var phase = (step + Math.floor(delayMs / SPLASH_STEP_MS)) % SPLASH_SWAY.length;
  return { dx: SPLASH_SWAY[phase] * Math.round(size / 3), dy: Math.ceil(fallPx * p * p) };
}
</script>

    walkFrame: 0,        // id of the requested animation frame, 0 when none
    selectedBed: null,   // id of the bed whose sheet is open
    move: null,          // move mode: {partyId, fromSlot, all}
    suppressClick: false, // set by a long press so that its click does not open the sheet
    tipTimer: null,
    toastTimer: null,
    panel: null,
    layoutKey: null,
    layers: null,
    view: null,          // the visible window of the map (zoom and pan), see the zoom functions in the logic script
    bounds: null,        // the whole viewport in scene units: the scene plus the grass around it (fitBounds)
    insetProbe: null,
    refit: null,         // recomputes the bounds after the viewport or the move bar changed
    svg: null,
    zoomReset: null,
    zoomCleanup: null,
    gestureId: 0,        // bumped when a pinch or a drag starts, so pending long-press timers give up
    gestureAt: 0,        // when a pinch or Safari gesture last did something
    navKeyAt: 0,         // when a key that moves focus (not Enter, Space or Escape) was last pressed
    sceneSize: null,
    pinching: false,     // two or more fingers are down on the map
    blockClick: false,   // a drag just ended: its click must not count as a tap
    ageNode: null,
    ageMax: 0
  };
  // The role from /api/join is kept for T-009 (admin). Nothing uses it yet.
  app.role = storage.get(KEYS.role);

  function $(id) { return document.getElementById(id); }

  // The scene and its hidden text summary are shown and hidden together.
  function showScene(on) {
    $("scene").hidden = !on;
    $("srSummary").hidden = !on;
  }

  function htmlEl(tag, attrs, text) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function svgEl(parent, tag, attrs, text) {
    var node = document.createElementNS(SVG_NS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    if (text !== undefined) node.textContent = text;
    if (parent) parent.appendChild(node);
    return node;

  function clearNode(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // --- requests ---

  function request(method, path, body, etag) {
    var headers = { "Accept": "application/json", "X-Client-Id": clientId };
    if (body !== undefined) headers["Content-Type"] = "application/json";
    if (etag) headers["If-None-Match"] = etag;
    return fetch(path, {
      method: method,
      headers: headers,
      body: body === undefined ? undefined : JSON.stringify(body),
      cache: "no-store",      // the browser then hands the 304 to this code
      credentials: "same-origin"
    }).then(function (res) {
      var etagOut = res.headers.get("ETag");
      if (res.status === 304) return { status: 304, json: null, etag: etagOut };
      return res.json().then(
        function (json) { return { status: res.status, json: json, etag: etagOut }; },
        function () { return { status: res.status, json: null, etag: null }; }
      );
    });
  }

  // A write for the bed actions (T-006) and the party form (T-007). It applies the `state` that
  // comes with a success and with an error (so the page rolls back to the server's truth) and
  // resolves to {ok, status, error, json}. `error` is undefined for a network failure (status 0).
  // `ops` are the pending changes of this write: they are dropped just before the answer is applied.
  function write(method, path, body, ops) {
    function settle() {
      if (ops) app.pending = app.pending.filter(function (op) { return ops.indexOf(op) === -1; });
    }
    return request(method, path, body).then(function (r) {
      settle();
      if (r.status === 401) showCodeScreen();
      var ok = r.status === 200 && r.json && r.json.ok;
      if (r.json && r.json.state) {
        app.writeEpoch++;
        // A write response has no ETag header, so forget the old one and let the poll below fetch the
        // new one. The poll after that gets a 304.
        app.etag = r.etag || null;
        applyState(r.json.state);
        if (ok) poll();
      } else {
        render();
      }
      if (ok) return { ok: true, status: r.status, error: undefined, json: r.json };
      return { ok: false, status: r.status, error: r.json ? r.json.error : undefined, json: r.json };
    }, function () {
      settle();
      render();
      return { ok: false, status: 0, error: undefined, json: null };
    });
  }

  function poll() {
    if (app.codeOpen || app.polling) return Promise.resolve();
    app.polling = true;
    var epoch = app.writeEpoch;
    return request("GET", "api/state", undefined, app.etag).then(function (r) {
      if (r.status === 401) { showCodeScreen(); return; }
      if (epoch !== app.writeEpoch) return;   // a write finished meanwhile and its state is newer
      if (r.status === 304) {
        app.fetchedAt = Date.now();
        renderAge();
      } else if (r.status === 200 && r.json && r.json.ok && r.json.state) {
        app.etag = r.etag;
        applyState(r.json.state);
      }
    }).catch(function () {
      // Offline or a bad reply: keep what is shown and try again on the next tick.
    }).then(function () {
      app.polling = false;
      if (!app.state && !app.codeOpen) {
        $("bootText").textContent = "Nepodarilo sa načítať, skúšam znova…";
        $("boot").classList.add("boot--error");
        setTimeout(poll, 4000);
      }
    });
  }

  // --- applying state ---

  function applyState(state) {
    app.state = state;
    app.fetchedAt = Date.now();
    if (app.night === null || state.event.nights.indexOf(app.night) === -1) app.night = state.event.nights[0];
    document.title = state.event.name;
    if (app.myParty && !partyById(state, app.myParty)) {
      forgetMyParty();
      app.askWho = true;
    }
    if (app.move && !partyById(state, app.move.partyId)) app.move = null;
    if (!app.introDone) {
      revealWhenReady();
      return;
    }
    render();
    openWhoIfAsked();
    if (app.panel && app.panel.refresh) app.panel.refresh();
  }

  function openWhoIfAsked() {
    if (!app.askWho || splash.falling) return;      // during the fall „Kto si?“ waits; the end of the fall asks again
    app.askWho = false;
    openWho();
  }

  // --- loading intro ---

  function prefersReducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  // First reveal of the map: wait until the splash has been up for its minimum time. Later states
  // during the wait only update app.state; there is never more than one timer.
  function revealWhenReady() {
    if (app.introDone || app.introTimer !== null || app.codeOpen) return;
    var wait = bootRemaining(app.introStart, performance.now(), bootMinMs(prefersReducedMotion()));
    app.introTimer = setTimeout(function () {
      app.introTimer = null;
      if (app.introDone || !app.state || app.codeOpen) return;
      app.introDone = true;
      render();
      if (app.panel && app.panel.refresh) app.panel.refresh();
      startFall();
    }, wait);
  }

  // --- the splash picture: a canvas of square blocks that falls apart downwards ---

  // splash.pic / splash.delays are filled by drawSplash(); the rest is the fall in progress.
  function resetSplash() {
    splash.falling = false;
    splash.raf = 0;
    splash.endTimer = null;
    splash.resizeFrame = 0;
    splash.lastStep = -1;
    splash.start = 0;
  }

  // Size the canvas from #boot, build the block grid and paint the still picture. Layout is read here
  // (and at the start of the fall), never inside the fall loop.
  function drawSplash() {
    var boot = $("boot"), canvas = $("bootCanvas");
    if (boot.hidden || splash.falling) return;
    var box = boot.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var grid = splashGrid(box.width, box.height);
    var pic = splashPicture(grid.cols, grid.rows);
    canvas.width = Math.round(box.width * dpr);
    canvas.height = Math.round(box.height * dpr);
    splash.ctx = canvas.getContext("2d");
    splash.ctx.imageSmoothingEnabled = false;
    splash.dpr = dpr;
    splash.size = grid.size;
    splash.cols = grid.cols;
    splash.rows = grid.rows;
    splash.height = box.height;
    // Block edges in whole device pixels, shared by neighbours, so there are no seams at fractional ratios.
    splash.xs = [];
    splash.ys = [];
    var i;
    for (i = 0; i <= grid.cols; i++) splash.xs.push(Math.round(i * grid.size * dpr));
    for (i = 0; i <= grid.rows; i++) splash.ys.push(Math.round(i * grid.size * dpr));
    splash.colors = [];
    splash.delays = [];
    for (var r = 0; r < grid.rows; r++) {
      for (var c = 0; c < grid.cols; c++) {
        splash.colors.push(COLORS[pic[r][c]]);
        splash.delays.push(splashDelay(c, r, grid.cols, grid.rows));
      }
    }
    paintSplash(-1);
  }

  // Clear the canvas and draw every block at its place, moved by splashFall() elapsedMs into the fall.
  // A negative elapsedMs draws the still picture.
  function paintSplash(elapsedMs) {
    var ctx = splash.ctx;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    var fallPx = splash.height + splash.size;
    for (var r = 0; r < splash.rows; r++) {
      var y0 = splash.ys[r], h = splash.ys[r + 1] - y0;
      for (var c = 0; c < splash.cols; c++) {
        var i = r * splash.cols + c;
        var dx = 0, dy = 0;
        if (elapsedMs >= 0) {
          var off = splashFall(elapsedMs, splash.delays[i], fallPx, splash.size);
          if (off.dy >= fallPx) continue;     // already below the screen
          dx = Math.round(off.dx * splash.dpr);
          dy = Math.round(off.dy * splash.dpr);
        }
        ctx.fillStyle = splash.colors[i];
        ctx.fillRect(splash.xs[c] + dx, y0 + dy, splash.xs[c + 1] - splash.xs[c], h);
      }
    }
  }

  // Start the fall of the splash. The map is already drawn underneath. With reduced motion there is no fall.
  function startFall() {
    if (bootFallMs(prefersReducedMotion()) === 0 || $("boot").hidden || !splash.ctx) {
      hideBoot();
      openWhoIfAsked();
      return;
    }
    splash.falling = true;
    splash.start = performance.now();
    splash.lastStep = -1;
    $("boot").classList.add("boot--falling");
    splash.endTimer = setTimeout(function () {      // not rAF: that stops in a background tab
      hideBoot();
      openWhoIfAsked();
    }, BOOT_FALL_MS);
    fallFrame();
  }

  // Time comes from the clock, not from a frame count. The canvas is redrawn only when the step changes.
  function fallFrame() {
    splash.raf = 0;
    if (!splash.falling) return;
    var elapsed = performance.now() - splash.start;
    var step = Math.floor(elapsed / SPLASH_STEP_MS);
    if (step !== splash.lastStep) {
      splash.lastStep = step;
      paintSplash(elapsed);
    }
    splash.raf = requestAnimationFrame(fallFrame);
  }

  // Stop a fall in progress and free the canvas, then hide the splash.
  function hideBoot() {
    var boot = $("boot"), canvas = $("bootCanvas");
    if (splash.raf) cancelAnimationFrame(splash.raf);
    if (splash.endTimer !== null) clearTimeout(splash.endTimer);
    if (splash.resizeFrame) cancelAnimationFrame(splash.resizeFrame);
    resetSplash();
    boot.classList.remove("boot--error", "boot--falling");
    boot.hidden = true;
    splash.ctx = null;
    canvas.width = canvas.height = 0;
  }

  // Show the splash again (after the code, before the first reveal) and draw it.
  function showBoot() {
    $("bootText").textContent = "Načítavam…";
    $("boot").classList.remove("boot--error", "boot--falling");
    $("boot").hidden = false;
    drawSplash();
  }

  // A rotation or a resized window during the hold: redraw on the next frame. Resizes during the fall are ignored.
  window.addEventListener("resize", function () {
    if ($("boot").hidden || splash.falling || splash.resizeFrame) return;
    splash.resizeFrame = requestAnimationFrame(function () {
      splash.resizeFrame = 0;
      drawSplash();
    });
  });

  // A move belongs to the party that started it, so a change of *moja partia* ends it.
  function forgetMyParty() {
    app.myParty = null;
    storage.remove(KEYS.party);
    app.move = null;
  }

  function setMyParty(id) {
    if (app.myParty !== id) app.move = null;
    app.myParty = id;
    storage.set(KEYS.party, id);
  }

  function selectNight(night) {
    cancelWalks();
    app.night = night;
    render();
    if (app.panel && app.panel.refresh) app.panel.refresh();
  }

  // The first tap on any bed also collapses the noticeboard.
  function collapseNotice() {
    if (app.noticeCollapsed) return;
    app.noticeCollapsed = true;
    storage.set(KEYS.notice, "1");
    renderBoards();
  }

  function expandNotice() {
    app.noticeCollapsed = false;
    storage.remove(KEYS.notice);
    renderBoards();
  }

  // --- scene ---

  function rect(parent, x, y, w, h, fill, attrs) {
    var a = { x: x, y: y, width: w, height: h, fill: fill };
    if (attrs) Object.keys(attrs).forEach(function (k) { a[k] = attrs[k]; });
    return svgEl(parent, "rect", a);
  }

  // Sets the text of a scene label and squeezes it to `maxWidth` if the font makes it wider.
  function setText(node, str, maxWidth) {
    node.removeAttribute("textLength");
    node.removeAttribute("lengthAdjust");
    node.textContent = str;
    if (!maxWidth || !node.getComputedTextLength) return;
    try {
      if (node.getComputedTextLength() > maxWidth) {
        node.setAttribute("textLength", String(maxWidth));
        node.setAttribute("lengthAdjust", "spacingAndGlyphs");
      }
    } catch (e) { /* not measurable (hidden): keep the natural width */ }
  }

  function addText(parent, x, y, str, size, fill, opts) {
    opts = opts || {};
    var node = svgEl(parent, "text", {
      x: x, y: y, "font-size": size, fill: fill,
      "text-anchor": opts.anchor || "start", "font-weight": opts.bold ? "700" : "400"
    });
    setText(node, str, opts.maxWidth);
    return node;
  }

  // A scene element that can be tapped: role, focus, label and Enter/Space like a click.
  function makeButton(g, label, key, onActivate) {
    g.setAttribute("role", "button");
    g.setAttribute("tabindex", "0");
    g.setAttribute("aria-label", label);
    g.setAttribute("data-key", key);
    g.addEventListener("click", onActivate);
    g.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        onActivate(e);
      }
    });
    return g;
  }

  function hitRect(g, r) {
    return rect(g, r[0], r[1], r[2], r[3], "transparent", { "class": "hit" });
  }

  // Wooden board: dark edge, face, light top edge and two plank lines.
  function board(parent, r, face, edge) {
    rect(parent, r[0], r[1], r[2], r[3], edge || COLORS.woodDark);
    rect(parent, r[0] + 3, r[1] + 3, r[2] - 6, r[3] - 6, face);
    rect(parent, r[0] + 3, r[1] + 3, r[2] - 6, 2, COLORS.woodLight, { opacity: ".55" });
  }

  function ensureScene() {
    var layout = app.state.layout;
    var key = JSON.stringify([layout.map, layout.rooms]);
    showScene(true);     // visible first: text is measured while drawing
    if (app.layoutKey === key) return;
    app.layoutKey = key;
    cancelWalks();      // the old walk layer goes away with the old svg
    var host = $("scene");
    clearNode(host);
    var vb = layout.map.viewbox;
    var svg = svgEl(host, "svg", {
      viewBox: "0 0 " + vb[0] + " " + vb[1], "shape-rendering": "crispEdges", role: "group",
      "aria-label": "Mapa chaty. Rovnaké údaje sú aj ako text hneď za mapou."
    });
    app.layers = {
      ground: svgEl(svg, "g", { "aria-hidden": "true" }),
      base: svgEl(svg, "g", { "aria-hidden": "true" }),
      beds: svgEl(svg, "g"),
      walk: svgEl(svg, "g", { "aria-hidden": "true", "pointer-events": "none" }),
      boards: svgEl(svg, "g"),
      tip: svgEl(svg, "g", { "aria-hidden": "true", "pointer-events": "none" })
    };
    drawBase(app.layers.base, layout);
    setupZoom(host, svg, vb[0], vb[1]);
  }

  // --- zoom and pan: only the svg viewBox changes, the scene stays crisp ---

  function applyView() {
    app.svg.setAttribute("viewBox", viewBoxText(app.view));
    app.zoomReset.hidden = !resetShown(app.view, app.bounds);
  }

  function setView(view) {
    app.view = view;
    applyView();
  }

  function resetView() {
    setView(wholeView(app.bounds));
  }

  // The safe-area insets (notch, home bar) in CSS px, read from a probe whose padding is the env() values.
  function readInsets() {
    if (!app.insetProbe) {
      app.insetProbe = htmlEl("div", { "class": "inset-probe", "aria-hidden": "true" });
      document.body.appendChild(app.insetProbe);
    }
    var cs = getComputedStyle(app.insetProbe);
    // While the move bar shows, the scene must sit below it: the bar's height (it includes the safe-area top padding)
    // is the top inset when that is larger.
    var bar = $("moveBar"), top = parseFloat(cs.paddingTop);
    if (!bar.hidden && bar.offsetHeight > top) top = bar.offsetHeight;
    return { top: top, right: parseFloat(cs.paddingRight), bottom: parseFloat(cs.paddingBottom), left: parseFloat(cs.paddingLeft) };
  }

  function setupZoom(host, svg, W, H) {
    var pointers = {};          // id -> {x, y} of the fingers or the mouse button held down on the map
    var drag = null;            // {sx, sy, lx, ly, moved} of the current gesture
    var pinch = null;           // the last {x, y, dist} while two fingers are down
    var blockTimer = null;
    var gestureScale = 1;

    var sizeChanged = !app.sceneSize || app.sceneSize[0] !== W || app.sceneSize[1] !== H;
    app.sceneSize = [W, H];
    if (sizeChanged) app.bounds = app.view = null;
    app.svg = svg;
    app.zoomReset = htmlEl("button", { "class": "zoom-reset", type: "button", "aria-label": "Celá mapa – zobraziť celú mapu" }, "Celá mapa");
    host.appendChild(app.zoomReset);
    svg.setAttribute("tabindex", "-1");     // focus target after „Celá mapa“ hides itself
    refit(true);      // a redraw of the layout keeps the zoom

    // The map fills the viewport: the bounds follow its size (resize, rotation, the Safari toolbar). The zoom stays
    // valid: a zoomed view keeps its factor and center, a whole view stays whole.
    function refit(force) {
      var r = host.getBoundingClientRect();
      if (!(r.width > 0 && r.height > 0) && app.bounds) return;      // hidden (the code screen): keep what we have
      var nb = fitBounds(r.width, r.height, W, H, readInsets());
      var old = app.bounds;
      if (!force && old && old.x === nb.x && old.y === nb.y && old.w === nb.w && old.h === nb.h) return;
      app.view = app.view && old ? refitView(app.view, old, nb) : wholeView(nb);
      app.bounds = nb;
      drawGround(app.layers.ground, nb);
      applyView();
    }

    function box() {
      var r = svg.getBoundingClientRect();
      return { left: r.left, top: r.top, width: r.width || 1, height: r.height || 1 };
    }
    function ids() { return Object.keys(pointers); }
    function measure() {
      var a = pointers[ids()[0]], b = pointers[ids()[1]];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, dist: Math.sqrt(Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2)) };
    }
    function capture(id) {

    }
    function endPress() {      // a pinch or a drag is no long press: pending timers give up
      app.gestureId++;
      app.gestureAt = Date.now();
    }
    // The point may be missing (iOS gesture events have no coordinates): zoom around the center of the map then.
    function zoomAround(factor, cx, cy) {
      var r = box();
      if (!isFinite(cx)) cx = r.left + r.width / 2;
      if (!isFinite(cy)) cy = r.top + r.height / 2;
      var p = scenePoint(app.view, r, cx, cy);
      setView(zoomView(app.view, app.bounds, factor, p.x, p.y));
    }
    // After a key zoom the focused bed or sign must still be in view.
    function revealFocused() {
      var node = document.activeElement;
      if (!node || !svg.contains(node) || !node.getBBox || node === svg || !resetShown(app.view, app.bounds)) return;
      try {
        var b = node.getBBox();
        setView(revealRect(app.view, app.bounds, [b.x, b.y, b.width, b.height], 6));
      } catch (err) { /* not measurable: leave the view */ }
    }

    svg.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (e.isPrimary) {      // the first finger: forget fingers whose release was lost (e.g. a redrawn bed)
        pointers = {};
        pinch = null;
      }
      app.blockClick = false;
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (ids().length === 1) {
        drag = { sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, moved: false };
      } else if (ids().length === 2) {
        app.pinching = true;
        endPress();
        if (drag) drag.moved = true;      // two fingers are never a tap
        pinch = measure();
        ids().forEach(function (id) { capture(Number(id)); });
      }
    });

    svg.addEventListener("pointermove", function (e) {
      var p = pointers[e.pointerId];
      if (!p || !drag) return;
      p.x = e.clientX;
      p.y = e.clientY;

        app.gestureAt = Date.now();
        setView(pinchView(app.view, app.bounds, box(), pinch, now));
        pinch = now;
        return;
      }
      if (!drag.moved && movedBeyond(drag.sx, drag.sy, e.clientX, e.clientY, LONG_PRESS_SLOP)) {
        drag.moved = true;      // beyond the tap tolerance: no tap, no long press from here on
        endPress();
        capture(e.pointerId);   // the move goes on even if a redraw replaces the bed under the finger
      }
      if (drag.moved) {
        setView(dragView(app.view, app.bounds, box(), e.clientX - drag.lx, e.clientY - drag.ly));
        drag.lx = e.clientX;
        drag.ly = e.clientY;
      }
    });

    function release(e) {
      if (!pointers[e.pointerId]) return;
      delete pointers[e.pointerId];

      if (left.length === 1 && drag) {      // one finger stays: it goes on panning from where it is
        drag.lx = pointers[left[0]].x;
        drag.ly = pointers[left[0]].y;
      }
      if (left.length < 2 && app.pinching) {
        app.pinching = false;
        app.gestureAt = Date.now();
      }
      if (left.length === 0 && drag) {

          app.blockClick = true;

          blockTimer = setTimeout(function () { app.blockClick = false; }, 100);
