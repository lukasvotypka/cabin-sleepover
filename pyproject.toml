[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chrapa-poll"
version = "1.8.0"
description = "Cabin sleeping-spot planner: a pixel-art map and a small FastAPI backend (YAML storage)."
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.159.0",
    "itsdangerous>=2.2.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
